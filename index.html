<style>
:root{
  color-scheme:dark;
  --slate:#2A333E; --clay:#E8A33D; --accent:#E8A33D;
  --bg:#101319; --surface:#161B22; --surface2:#10151B; --card:#161B22; --rail:#0B0D12;
  --line:#242C37; --line-soft:#1A212A; --track:#1C242D; --axis:#2A333E;
  --fg:#E4E7EC; --dim:#6E7987; --head:#F3F5F8; --num:#C8D0DA; --faint:#4C5563;
  --ink-mix:#F2F6FA; --accent2:#6FB6A4; --danger:#E06B52; --onaccent:#14171C;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;
  --accent-ink:color-mix(in srgb, var(--accent) 68%, var(--ink-mix));
  --accent-wash:color-mix(in srgb, var(--accent) 13%, transparent)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}

/* ---------- 상단 바 ---------- */
.topbar{background:var(--slate);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1080px;margin:0 auto;padding:0 34px;height:58px;display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.015em;color:#F0F2F5;
  background:none;border:0;font-family:var(--sans);padding:0}
.mark .bead{width:20px;height:20px;border-radius:50%;background:var(--accent);flex:none;transition:background-color .25s;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent)}
.addbtn{margin-left:auto;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.24);color:#EDEFF3;
  font-size:13px;padding:8px 15px;border-radius:8px;transition:.15s}
.addbtn:hover{background:#fff;color:var(--slate);border-color:#fff}
.addbtn.solid{background:var(--accent-ink);border:0;color:#fff;font-weight:600;margin-left:0;padding:10px 20px}
.addbtn.solid:hover{filter:brightness(1.08);color:#fff}

/* ---------- 본문 ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 34px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:29px;font-weight:600;letter-spacing:-.035em;margin-top:3px;color:var(--head)}
.stat .v small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);margin-left:4px;letter-spacing:0}
.panel.on{display:block}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.025em;color:var(--head)}
.sec-head .note{font-size:12.5px;color:var(--dim);font-weight:300}
.rule{height:0;margin:14px 0 16px}

/* ---------- 차트 ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 16px 10px}
.chart-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:0 4px}
.legend{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.hollow{background:none;border:2px solid var(--accent)}
.legend i.dash{background:none;border:1px dashed var(--slate)}
svg{display:block;width:100%;height:auto;overflow:visible}
.grid-l{stroke:var(--line-soft)}
.axis-l{stroke:var(--line)}
.axis-t{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
.axis-title{font-family:var(--mono);font-size:10px;fill:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.flag-ring{stroke:var(--slate);stroke-width:1.2;stroke-dasharray:3 3}
.dot{cursor:pointer;transition:.15s}
.dot:hover{filter:saturate(1.35) drop-shadow(0 2px 6px rgba(74,85,104,.35))}
.dot-lab{font-family:var(--mono);font-size:9.5px;fill:var(--dim);pointer-events:none}
.nodata{color:var(--dim);padding:24px 6px;font-size:13px}

/* ---------- 테이블 ---------- */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:4px 12px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;padding:14px 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer;transition:.12s}
.tbl tr.row:hover{background:var(--accent-wash)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--num)}
.num.em{color:var(--accent-ink);font-weight:600}
.bean-n{display:block;font-weight:600;font-size:13.5px;line-height:1.35;color:var(--head)}
.bean-s{font-family:var(--mono);font-size:11px;color:var(--dim)}
.stars{color:var(--accent-ink);font-size:12px;letter-spacing:1px}
.stars b{color:var(--line)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.flag{background:var(--slate);border-color:var(--slate);color:#fff}
.chip.intent,.chip.new{background:var(--accent-wash);border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:var(--accent-ink)}
.det{background:var(--surface2)}
.det-in{padding:8px 12px 20px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-content:start;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--num)}
.taste{display:grid;gap:10px;align-content:start}
.taste-row{display:grid;grid-template-columns:44px 1fr 24px;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:background-color .25s}
.taste-row .num{text-align:right;font-size:11px;color:var(--dim)}
.memo{grid-column:1/-1;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;color:#4E5768;font-size:13px;font-weight:300;transition:border-color .25s}

/* ---------- 원두 ---------- */
.beans{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.bean{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;flex-direction:column;gap:11px;transition:.15s}
.bean:hover{border-color:color-mix(in srgb, var(--accent) 55%, transparent);box-shadow:0 4px 16px rgba(74,85,104,.07)}
.bean .roaster{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink)}
.bean h3{font-size:14.5px;font-weight:600;margin:5px 0 0;line-height:1.35;color:var(--head)}
.bean .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--num)}
.bean .meta b{color:var(--dim);font-weight:400}
.bnote{font-size:12px;color:var(--dim);font-weight:300}
.age{color:var(--accent-ink);font-weight:500}
.rl{display:flex;gap:3px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft)}
.rl i{height:5px;flex:1;background:var(--track);border-radius:99px}
.rl i.on{background:var(--accent)}
.rl span{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:7px;white-space:nowrap}

/* ---------- 빈 상태 / 커핑 ---------- */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:52px 26px;text-align:center}
.empty h3{font-size:18px;font-weight:600;margin:0 0 9px;letter-spacing:-.02em;color:var(--head)}
.empty p{color:var(--dim);max-width:44ch;margin:0 auto 20px;font-size:13.5px;font-weight:300}
.cup .det-in{padding:18px 8px}
.cup-t{font-size:19px;font-weight:600;margin:8px 0 3px;letter-spacing:-.025em;color:var(--head)}
.bigscore{font-size:50px;font-weight:600;color:var(--accent-ink);margin:16px 0 0;letter-spacing:-.045em;line-height:1;transition:color .25s}

/* ---------- 장비 ---------- */
.gear-grp{margin-bottom:28px}
.gear-grp>h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 12px;font-weight:500}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:12px}
.gear-i{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.g-k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.g-m{font-size:12px;color:var(--dim);line-height:1.5;font-weight:300}

/* ---------- 메인: 시트 카드 ---------- */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
.sheet.all{background:linear-gradient(180deg,var(--surface),#F4F4F3)}
.sheet.wide{margin-top:13px;padding-top:22px;grid-template-columns:1fr auto;align-items:center;
  background:linear-gradient(180deg,var(--surface),#F3F3F2)}
.sheet.wide .sname{font-size:15px}
.sheet.wide .sgo{opacity:1;transform:none;margin-top:0}

/* ---------- 시트 페이지 헤더 ---------- */
.pagehead .eyebrow{display:flex;align-items:center;gap:7px}
.charttitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.gap{height:14px}

/* ---------- 모달 ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(52,60,74,.42);backdrop-filter:blur(3px);z-index:60;display:none;overflow-y:auto;padding:22px}
.scrim.on{display:block}
.modal{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(44,52,68,.18)}
.modal-h{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.02em;color:var(--head)}
.x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--fg);background:var(--surface2)}
.modal-b{padding:18px 20px 22px}
.type-seg{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.type-seg button{flex:1;min-width:92px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:12.5px;padding:9px}
.type-seg button[aria-pressed="true"]{background:var(--slate);color:#fff;border-color:var(--slate);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
.f label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-family:var(--mono);font-size:13px;padding:10px;width:100%}
.f textarea{font-family:var(--sans);min-height:62px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.hint{font-family:var(--mono);font-size:10px;color:var(--dim)}
.modal-f{display:flex;gap:10px;align-items:center;padding:15px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.save{background:var(--slate);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:13px;padding:10px 22px}
.save:hover{filter:brightness(1.14)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:13px;padding:10px 18px}
.ghost:hover{color:var(--fg);border-color:var(--dim)}
.err{color:#B4483A;font-size:12px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--slate);color:#fff;font-size:13px;font-weight:500;padding:11px 20px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 26px rgba(44,52,68,.24)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .mark{padding:0}
  
  .addbtn{width:auto;padding:8px 14px}
  .det-in,.fgrid{grid-template-columns:1fr}
  .hide-s{display:none}
  .wrap{padding:0 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ================= 메인 화면 v2 ================= */
html[data-theme="light"]{
  color-scheme:light;
  --slate:#17202B; --clay:#E8A33D; --accent:#E8A33D;
  --bg:#FBFBFC; --surface:#FFFFFF; --surface2:#F7F9FC; --card:#FFFFFF; --rail:#FFFFFF;
  --line:#DDE4EC; --line-soft:#EDF1F6; --track:#EDF1F6; --axis:#C3CDD9;
  --fg:#17202B; --dim:#6E7A8A; --head:#17202B; --num:#4B5766; --faint:#8B96A5;
  --ink-mix:#17202B; --accent2:#12876F; --danger:#D0453B; --onaccent:#14171C;
}

body{position:relative}

/* 상단바 */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{height:60px;justify-content:center;position:relative}
.mark{color:var(--head);gap:9px}
.mark .bead{width:22px;height:22px}
.topright{position:absolute;right:34px;display:flex;gap:8px;align-items:center}
.pillbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--fg);
  font-size:12.5px;padding:7px 14px;display:flex;align-items:center;gap:6px;transition:.15s;font-family:var(--sans)}
.pillbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.addbtn{margin-left:0}

/* 시트 카드 v2 */
.sec-head{justify-content:center;text-align:center}
.sec-head h2{font-size:17px}
.rule{display:none}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:16px;margin-top:22px}
.sheet.wide{grid-template-columns:1fr auto;align-items:center;padding:22px 24px;margin-top:16px;
  background:linear-gradient(180deg,var(--surface),var(--surface2))}
.sheet.wide .sdesc{min-height:0;margin-top:5px}
.sheet.wide .sgo{margin-top:0}
.homefoot{text-align:center;padding:44px 0 10px}
.homefoot p{font-size:11.5px;color:var(--dim);margin:0 0 5px;line-height:1.7}
.homefoot .pal{font-family:var(--mono);font-size:10.5px}
@media (max-width:760px){
  .topright{right:16px}
  .topbar-in{padding:0 16px}
}

/* ===== 분쇄도 대응표 ===== */
.umhint{font-size:12px;line-height:1.6;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:rgba(0,0,0,.02)}
.umhint b{font-weight:600}
.umhint .src{display:block;font-size:10.5px;opacity:.5;margin-top:4px}
.umtable{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:0 0 14px;background:rgba(0,0,0,.015)}
.umtable>b{display:block;font-size:12px;letter-spacing:.04em;opacity:.65;margin-bottom:8px;font-weight:600}
.umtable.empty{font-size:12.5px;line-height:1.6;opacity:.75}
.umrow{display:flex;flex-wrap:wrap;gap:6px}
.umrow span{display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--card,#fff)}
.umrow i{font-style:normal;font-weight:700;color:var(--accent,#7E9AA6)}
.umrow u{text-decoration:none;font-size:10px;opacity:.45}
.umtable .note{display:block;font-size:11px;opacity:.55;margin-top:7px}
.rec-m .est{font-style:normal;font-size:11.5px;opacity:.6}
.guidebtn{display:inline-block;margin-top:8px;font-size:11.5px;text-decoration:none;
  border:1px solid var(--accent,#7E9AA6);color:var(--accent,#7E9AA6);border-radius:7px;padding:5px 10px;white-space:nowrap}
.guidebtn:hover{background:var(--accent,#7E9AA6);color:#fff}
.umhint .guidebtn{margin-top:6px}
.umtable.empty p{margin:0 0 4px}
.rec-tools{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.rec-tools button{width:28px;height:28px;padding:0;line-height:1;font-size:13px;
  border:1px solid var(--line);border-radius:7px;background:var(--card,#fff);cursor:pointer;opacity:.55;
  display:flex;align-items:center;justify-content:center}
.rec-tools button:hover{opacity:1;border-color:var(--accent,#7E9AA6);color:var(--accent,#7E9AA6)}
.rec-t{padding-right:66px}
.ovbox.narrow{max-width:340px}
.cmsg{font-size:13.5px;line-height:1.65;margin:2px 0 16px}
.ovact button.danger{background:#B4544A}

/* ===== 레시피 시트 ===== */
.rec-grp{margin:22px 0 8px}
.rec-grp h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.rec-grp h3 em{font-style:normal;font-size:12px;opacity:.55;font-weight:400}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rec{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card,#fff)}
.rec-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.rec-t h4{margin:0;font-size:16px}
.rec-t .fav{color:#D9A441}
.rec-b{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;opacity:.7}
.rec-m{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;font-size:13px;align-items:baseline}
.rec-m b{font-weight:500;opacity:.55;font-size:11.5px}
.rec-p{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.rec-p .pv{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-flex;gap:5px;align-items:center}
.rec-p .pv i{font-style:normal;opacity:.5;font-size:10px}
.rec-memo{margin-top:10px;font-size:12.5px;line-height:1.55;opacity:.75}
.rec-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rec-act button{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
.rec-act button:hover{background:rgba(0,0,0,.04)}
.pourwrap{margin:6px 0 8px}
.pour-hd,.pour-r{display:grid;grid-template-columns:26px 1fr 1fr 58px 44px 32px;gap:6px;align-items:center}
.pour-hd{font-size:10.5px;opacity:.5;margin-bottom:4px}
.pour-r{margin-bottom:5px}
.pour-r input{padding:6px 8px;font-size:13px}
.pour-r .pn{font-size:11px;opacity:.5;text-align:center}
.pour-r .pc{font-size:11.5px;opacity:.6;text-align:right}
.pour-r .pstir,.pour-r .pdel{border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;font-size:11px;padding:5px 0}
.pour-r .pstir.on{background:var(--accent,#7E9AA6);color:#fff;border-color:transparent}
.pour-sum{font-size:11.5px;opacity:.6;margin-top:4px}
.pour-empty{font-size:12px;opacity:.5;padding:8px 0}
.hint2{font-size:10.5px;opacity:.5;font-weight:400}
.addbtn.tiny{font-size:12px;padding:5px 10px}
.g-spec{display:block;font-size:11px;opacity:.55;margin-top:2px}
/* 오버레이(타이머·이력) */
.ov{position:fixed;inset:0;background:rgba(20,18,16,.55);display:none;align-items:center;justify-content:center;z-index:120;padding:16px}
.ov.on{display:flex}
.ovbox{background:var(--bg,#FAF8F5);border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.ovh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ovh h3{margin:0;font-size:16px}
.ovh .x{border:0;background:transparent;font-size:18px;cursor:pointer;opacity:.6}
.tclock{font-size:52px;font-weight:700;text-align:center;letter-spacing:.02em;margin:6px 0}
.tnext{text-align:center;font-size:13px;opacity:.7;margin-bottom:14px;min-height:20px}
.tsteps{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.ts{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.ts b{opacity:.5;font-weight:500;font-size:11px}
.ts.now{border-color:#7E9AA6;background:rgba(126,154,166,.1)}
.ts.done{opacity:.4;text-decoration:line-through}
.ts.none{display:block;opacity:.55;font-size:12px}
.ovact{display:flex;gap:8px;flex-wrap:wrap}
.ovact button{flex:1;min-width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font-size:13px}
.ovact button.solid{background:var(--slate,#4A5568);color:#fff;border-color:transparent}
.hist{display:flex;flex-direction:column;gap:8px}
.hist.none{font-size:12.5px;opacity:.6;line-height:1.6}
.hi{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.hi>div:first-child{display:flex;gap:8px;align-items:baseline;font-size:12px}
.hi b{font-size:13px}
.hi span{opacity:.55}
.hi .hs{font-size:12px;opacity:.75;margin:5px 0 8px}
.hi button{font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}

/* ===== 원두 아카이브 연동 패널 ===== */
.beaninfo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.02)}
.beaninfo .bi-t{font-size:11px;letter-spacing:.08em;opacity:.6;margin-bottom:6px}
.beaninfo .bi-b{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;line-height:1.5}
.beaninfo .bi-b b{font-weight:600;opacity:.65;margin-right:4px;font-size:12px}

/* ================= 페이지 전환 ================= */
#page-home{display:none}
#page-home.on{display:block}
#page-sheets{display:none;padding:26px 0 70px}
#page-sheets.on{display:grid;grid-template-columns:216px 1fr;gap:30px;align-items:start}

/* 좌측 시트 내비 */
.snav{position:sticky;top:78px;display:flex;flex-direction:column;gap:3px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.snav .navtitle{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:4px 9px 8px}
.snav button{--c:var(--slate);display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;color:var(--fg);font-family:var(--sans);font-size:13px;
  padding:9px 10px;transition:.15s}
.snav button i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;opacity:.5;transition:.15s}
.snav button em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
.snav button:hover{background:var(--surface2)}
.snav button:hover i{opacity:1}
.snav button[aria-current="true"]{background:color-mix(in srgb, var(--c) 14%, transparent);font-weight:600}
.snav button[aria-current="true"] i{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent)}
.snav .navback{border-top:1px solid var(--line-soft);margin-top:8px;padding-top:12px;border-radius:0;
  font-family:var(--mono);font-size:11px;color:var(--dim)}
.snav .navback i{display:none}

/* 시트 페이지 본문 */
.sheadwrap{margin-bottom:20px}
.sheadwrap .eyebrow{display:flex;align-items:center;gap:7px}
.sheadwrap .hdot{width:8px;height:8px;border-radius:50%;background:var(--accent);transition:background-color .25s}
.sheadwrap h1{font-size:clamp(23px,3vw,30px);font-weight:700;letter-spacing:-.035em;margin:10px 0 0;color:var(--head)}
.sheadwrap p{color:var(--dim);max-width:60ch;margin:8px 0 0;font-size:13.5px;font-weight:300}
.exall{background:none;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px;
  color:var(--dim);padding:5px 13px;margin-top:14px;transition:.15s}
.exall:hover{border-color:var(--accent);color:var(--accent-ink)}

/* 드롭다운(아코디언) */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px;overflow:hidden;scroll-margin-top:80px}
.acc-head{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:16px 18px;font-family:var(--sans);text-align:left;transition:.15s;position:relative}
.acc-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.85}
.acc-head:hover{background:var(--accent-wash)}
.acc-head .aicon{font-size:16px;line-height:1}
.acc-head .aname{font-size:15px;font-weight:600;color:var(--head);letter-spacing:-.02em}
.acc-head .acount{font-family:var(--mono);font-size:11px;color:var(--accent-ink);
  background:var(--accent-wash);border-radius:999px;padding:3px 9px}
.acc-head .adesc{font-size:12px;color:var(--dim);font-weight:300;margin-left:4px}
.acc-head .chev{margin-left:auto;color:var(--dim);font-size:11px;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:4px 18px 22px;border-top:1px solid var(--line-soft)}
.acc.open .acc-body{display:block}
.acc.open .acc-head{background:var(--accent-wash)}

@media (max-width:860px){
  #page-sheets.on{grid-template-columns:1fr;gap:16px}
  .snav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:9px}
  .snav::-webkit-scrollbar{display:none}
  .snav .navtitle{display:none}
  .snav button{width:auto;white-space:nowrap}
  .snav button em{display:none}
  .snav .navback{border-top:0;border-left:1px solid var(--line-soft);margin-top:0;padding-top:9px;margin-left:4px;padding-left:12px}
  .acc-head .adesc{display:none}
  .acc-body{padding:4px 12px 18px}
}

/* ===== 메인 카드 배치 v3: 전체 보기 상단 · 5시트 한 줄 ===== */
.sheets{grid-template-columns:repeat(5,1fr);gap:12px;margin-top:0}

/* 전체 보기 — 상단 전폭 카드 */
.sheet.wide{grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  margin:0 0 16px;padding:24px 26px;border-radius:14px;
  background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 55%)}
.sheet.wide::before{height:5px}
.sheet.wide .wmark{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;
  background:var(--accent);color:#fff;font-size:20px;flex:none}
.sheet.wide .wtxt{display:block;text-align:left}
.sheet.wide .sname{font-size:17px;font-weight:700}
.sheet.wide .sdesc{min-height:0;margin-top:4px;font-size:12.5px}
.sheet.wide .wdots{display:flex;gap:5px;margin-top:10px}
.sheet.wide .wdots i{width:9px;height:9px;border-radius:50%}
.sheet.wide .sgo{margin-top:0;font-size:13px;white-space:nowrap}
.sheet.wide:hover{transform:translateY(-2px)}

@media (max-width:1000px){.sheets{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){
  .sheets{grid-template-columns:repeat(2,1fr)}
  .sheet.wide{grid-template-columns:auto 1fr;gap:14px;padding:20px}
  .sheet.wide .sgo{grid-column:2;margin-top:10px}
}

/* 전체 보기 카드를 5열 그리드 전체에 맞춤 */
.sheets{margin-top:22px}
.sheet.wide{grid-column:1 / -1;margin:0 0 4px}
@media (max-width:1000px){.sheet.wide{grid-column:1 / -1}}

/* ================= 메인 화면 v4 : 배너 + 칩 + 카드 ================= */
html,body{overflow-x:hidden}

/* --- 칩 내비 --- */
.chiprow button.solid{background:var(--slate);color:#fff;border-color:var(--slate);padding-left:16px}
.chiprow button.solid i{display:none}

/* --- 프로모 카드 --- */
.promo.wide{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  background:linear-gradient(120deg, color-mix(in srgb, var(--slate) 8%, var(--surface)), var(--surface) 60%);
  border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.promo.wide .wmark{width:46px;height:46px;border-radius:11px;background:var(--slate);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.promo.wide .ptitle{margin-top:0;font-size:16px}
.promo.wide .psub{margin-top:3px}
.promo.wide .wdots{display:flex;gap:5px;margin-top:9px}
.promo.wide .wdots i{width:9px;height:9px;border-radius:50%}
.promo.wide .pgo{font-size:13px;font-weight:600;color:var(--num);white-space:nowrap}
.promo.wide:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(74,85,104,.12)}

/* 기존 히어로/시트카드 숨김 */
.hero,.sheets,.sec-head{display:none}

@media (max-width:700px){
  .promo.wide{grid-template-columns:auto 1fr;padding:16px}
  .promo.wide .pgo{grid-column:2;margin-top:8px}
}

.quickadd{display:flex;justify-content:flex-end;margin-bottom:12px}
.quickadd .addbtn.solid{font-size:12.5px;padding:8px 16px}

.gear-i.mine{border-color:color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow:inset 3px 0 0 var(--accent)}

/* 수정 버튼 */
.editbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-family:var(--sans);font-size:11px;padding:4px 10px;transition:.15s;cursor:pointer}
.editbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.editbtn.corner{position:absolute;right:10px;top:10px;padding:3px 8px;opacity:0}
.bean:hover .editbtn.corner,.gear-i:hover .editbtn.corner{opacity:1}
.bean,.gear-i{position:relative}
.detedit{grid-column:1/-1;display:flex;justify-content:flex-end}
.editnote{font-size:12.5px;color:var(--dim);background:var(--accent-wash);
  border:1px dashed color-mix(in srgb, var(--accent) 40%, transparent);border-radius:9px;padding:10px 14px;width:100%}

.editedmark{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:5px;margin-top:8px}
.editedmark::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7}
.detedit{align-items:center;gap:12px}
.detedit .editedmark{margin-top:0}

/* 워드마크 */
.mark{flex-direction:row;align-items:baseline;gap:10px}
.wordmark{font-family:var(--mono);font-weight:600;font-size:16.5px;letter-spacing:.05em;color:var(--head)}
.wordmark i{font-style:normal;color:var(--accent);transition:color .25s}
.wordsub{font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.02em}
@media (max-width:700px){.wordsub{display:none}}

.exportbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--num);
  font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 18px;transition:.15s;cursor:pointer}
.exportbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.danger{background:none;border:1px solid color-mix(in srgb,#B4483A 45%,transparent);border-radius:8px;
  color:#B4483A;font-size:13px;padding:10px 16px;cursor:pointer;font-family:var(--sans)}
.danger:hover{background:#B4483A;color:#fff;border-color:#B4483A}

.csvmsg{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.6;font-weight:300}
.csvta{width:100%;height:260px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  font-family:var(--mono);font-size:11px;color:var(--fg);padding:12px;resize:vertical;white-space:pre;overflow:auto}
.csvta:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}

/* ---- 모바일 터치 보강 ---- */
@media (max-width:700px){
  .tbl{font-size:12.5px}
  .acc-head{padding:14px 14px}
  .modal{max-width:none;border-radius:14px}
  .modal-b{max-height:60vh;overflow-y:auto}
  input,select,textarea{font-size:16px !important} /* iOS·삼성 인터넷 자동 확대 방지 */
}
html{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}

.csvta.sync{height:96px;font-size:10px;word-break:break-all;white-space:pre-wrap}
.synclabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.syncrow{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.syncbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--num);
  font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 18px;transition:.15s;cursor:pointer}
.syncbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* 시트 픽토그램 크기·색 */
.acc-head .aicon{font-size:0;line-height:0}
.acc-head .aicon svg{width:21px;height:21px;color:var(--accent-ink);display:block}
.promo.wide .wmark{font-size:0}
.promo.wide .wmark svg{width:26px;height:26px;color:#fff;display:block}

/* 모바일 상단 버튼 축소 */
@media (max-width:700px){
  .pillbtn{font-size:11px;padding:5px 10px;gap:4px}
  .topbar-in{height:52px;gap:8px}
  .topright{right:12px;gap:6px}
  .wordmark{font-size:14.5px}
}

/* ===== 시트 페이지 모바일 레이아웃 수정 =====
   그리드 자식의 min-width 기본값(auto) 때문에 표(min-width 640px)가
   컨테이너를 강제로 넓혀 화면이 잘리고, body overflow-x:hidden과 겹쳐
   가로 스크롤도 막히던 문제 — 자식 min-width:0으로 내부 스크롤로 전환 */
#page-sheets.on>*{min-width:0}
.scontent,.acc,.acc-body{min-width:0;max-width:100%}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.chart-card{max-width:100%;overflow:hidden}
.det-in{min-width:0}
@media (max-width:700px){
  .det-in{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .acc-body{padding:4px 10px 16px}
  .cup .det-in svg{max-width:260px;margin:0 auto}
}

.verbtn{background:none;border:0;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:10px}
.verbtn:hover{color:var(--accent-ink)}
.ver-i{padding:12px 2px;border-bottom:1px solid var(--line-soft)}
.ver-i:last-child{border-bottom:0}
.ver-v{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.ver-v span{font-weight:400;color:var(--dim);margin-left:8px;font-size:10.5px}
.ver-t{font-size:12.5px;color:var(--num);margin-top:4px;font-weight:300;line-height:1.6}

/* 장비 제품 낱개 리스트 */
.gear-grp>h3 em{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:0;margin-left:8px;text-transform:none;font-size:10px}
.g-prod{list-style:none;margin:7px 0 0;padding:0;display:grid;gap:5px}
.g-prod li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--head);line-height:1.45}
.g-prod li i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;opacity:.75}
.g-prod li.mine i{box-shadow:0 0 0 3px var(--accent-wash)}
.editbtn.tiny{padding:1px 6px;font-size:10px;margin-left:auto;opacity:0}
.gear-i:hover .editbtn.tiny{opacity:1}
.g-m{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line-soft)}

.g-empty{font-size:11.5px;color:var(--dim);font-weight:300;margin-top:8px;line-height:1.6}
.quickadd{gap:8px}

/* 구분 등록 버튼 — 밝은 배경 위에서도 보이게 */
.quickadd .addbtn:not(.solid){background:var(--surface);border:1px solid var(--line);color:var(--num);
  font-weight:500;margin-left:auto;padding:9px 18px}
.quickadd .addbtn:not(.solid):hover{border-color:var(--accent);color:var(--accent-ink);background:var(--surface)}
/* 제품 순서 이동 */
.rowtools{margin-left:auto;display:inline-flex;gap:3px;align-items:center}
.g-prod li .editbtn.tiny{margin-left:0}
.gear-i:hover .ordbtn{opacity:1}
@media (max-width:700px){
  .ordbtn,.gear-i .editbtn.tiny,.gear-i .editbtn.corner{opacity:.55}
}

/* 드래그 그립 · 드래그 상태 */
.g-prod li{border-radius:8px;padding:3px 6px;margin:0 -6px;touch-action:pan-y}
.g-prod li .grip{color:var(--dim);cursor:grab;font-size:14px;padding:2px 7px;opacity:0;transition:.15s;
  touch-action:none;user-select:none}
.gear-i:hover .grip{opacity:.9}
.g-prod li.drag-active{background:var(--accent-wash);box-shadow:0 8px 20px rgba(20,25,35,.14);
  opacity:.96;position:relative;z-index:5;cursor:grabbing}
.g-prod li.drag-active .grip{cursor:grabbing}
body.drag-lock{overflow:hidden}
body.drag-lock *{user-select:none;-webkit-user-select:none}
@media (max-width:700px){.g-prod li .grip{opacity:.55}}

/* ══════════════════════════════════════════════════════
   한잔록 — 도감 테마 (v1.19.0)
   기존 구조는 그대로 두고 표면만 다시 입힌다.
   ══════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');

:root{
  color-scheme:dark;
  --slate:#2A333E; --clay:#E8A33D; --accent:#E8A33D;
  --bg:#101319; --surface:#161B22; --surface2:#10151B; --card:#161B22; --rail:#0B0D12;
  --line:#242C37; --line-soft:#1A212A; --track:#1C242D; --axis:#2A333E;
  --fg:#E4E7EC; --dim:#6E7987; --head:#F3F5F8; --num:#C8D0DA; --faint:#4C5563;
  --ink-mix:#F2F6FA; --accent2:#6FB6A4; --danger:#E06B52; --onaccent:#14171C;
  --serif:'IBM Plex Sans KR',system-ui,sans-serif;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
body{font-weight:300;letter-spacing:.01em}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ── 상단 괘선 헤더 ── */
.topbar{background:var(--bg);border-bottom:1px solid var(--fg);position:sticky;top:0}
.topbar-in{height:62px}
.mark{color:var(--fg);gap:12px;align-items:baseline}
.mark .bead{display:none}
.wordmark{font-family:var(--serif);font-size:22px;letter-spacing:.16em;font-weight:400}
.wordsub{font-size:10.5px;letter-spacing:.24em;color:var(--dim)}
.pillbtn{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:0;
  font-size:11px;letter-spacing:.06em;padding:7px 12px}
.pillbtn:hover{border-color:var(--accent);color:var(--accent);background:transparent}

/* ── 시트 페이지 ── */
.sheadwrap{padding:44px 0 24px;border-bottom:1px solid var(--fg);margin-bottom:26px}
.sheadwrap .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--accent)}
.sheadwrap .hdot{display:none}
.sheadwrap h1{font-size:clamp(27px,4.4vw,38px);margin:11px 0 9px}
.sheadwrap p{font-size:12.5px;color:var(--dim);line-height:1.95;max-width:54ch}
.exall{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:0;
  font-size:11.5px;letter-spacing:.06em;padding:8px 14px}
.acc{border:0;border-radius:0;background:transparent;margin:0 0 6px}
.acc-head{background:transparent;border-bottom:1px solid var(--line);padding:14px 0}
.acc .aicon{display:none}
.acc .aname{font-family:var(--serif);font-size:18px}
.acc .acount,.acc .adesc{font-size:11.5px;color:var(--dim)}
.acc-body{padding:22px 0 0}
.snav button{border-radius:0;border:0;border-left:1px solid transparent;font-size:12.5px;color:var(--dim);
  font-family:var(--sans);letter-spacing:.02em}
.snav button i{display:none}
.snav button:hover,.snav button[aria-current=true]{border-left-color:var(--accent);color:var(--fg);background:transparent}
.snav .navtitle{font-size:10px;letter-spacing:.26em;color:var(--dim)}

/* ── 상단바: 로고와 우측 버튼 겹침 방지 ── */
.topbar-in{position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:10px;height:auto;min-height:60px;padding:10px 20px;flex-wrap:nowrap}
.topright{position:static;right:auto;flex:0 0 auto;gap:6px}
.mark{flex:1 1 auto;min-width:0;flex-direction:column;align-items:flex-start;gap:2px}
.wordmark{white-space:nowrap}
.wordsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ── 표: 카드 껍데기를 벗기고 괘선으로 ── */
.tblwrap{background:transparent;border:0;border-radius:0;padding:0;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.tbl{min-width:560px}
.tbl th{padding:0 14px 11px 0;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;
  text-transform:none;border-bottom:1px solid var(--fg);color:var(--dim);white-space:nowrap}
.tbl td{padding:15px 14px 15px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th:first-child,.tbl td:first-child{padding-left:2px}
.tbl th:last-child,.tbl td:last-child{padding-right:2px}
.tbl tbody tr:last-child td{border-bottom:1px solid var(--line)}
.tbl tr.row:hover{background:transparent}
.tbl tr.row:hover td{background:rgba(140,122,75,.06)}
.det-in{padding:4px 2px 18px}

/* ── 카드·목록도 좌우 여백 ── */
.gear-grp h3,.rec-grp h3,.sec-h,.quickadd{padding-left:2px}

/* ── 카드·표 공통 ── */
.card,.bean,.gear-i,.rec,.chart-card,.tbl,.umtable,.beaninfo{
  border:1px solid var(--line);border-radius:0;background:var(--surface);box-shadow:none}
.beans,.gear,.recs{gap:1px;background:var(--line);border:1px solid var(--line)}
.beans .bean,.gear .gear-i,.recs .rec{border:0}
table{border-collapse:collapse}
th{font-size:10.5px;letter-spacing:.18em;color:var(--dim);font-weight:400;
  border-bottom:1px solid var(--fg);background:transparent;text-transform:none}
td{border-top:0;border-bottom:1px solid var(--line);font-size:13px}
td.num,.num,.rratio{font-family:var(--serif);font-size:14.5px}
.bean-n{font-family:var(--serif);font-size:15px}
.bean-s{font-size:11px;color:var(--dim)}
.chip{border-radius:0;border:1px solid var(--line);background:transparent;font-size:10.5px;color:var(--dim)}
.chip.flag{border-color:var(--accent);color:var(--accent);background:transparent}
.chip.intent{border-color:var(--line);color:var(--dim)}
.stars{color:var(--accent);letter-spacing:2px}
.stars b{color:rgba(28,31,27,.24)}
.kv dt{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.kv dd{font-family:var(--serif);font-size:14px}
.taste-row .bar{background:var(--track);border-radius:0}
.taste-row .bar i{background:var(--accent);border-radius:0}
.g-k{font-family:var(--serif);font-size:15px}
.g-prod li{font-family:var(--serif);font-size:14.5px}
.g-spec,.g-m{font-family:var(--sans);font-size:10.5px;color:var(--dim)}
.rl i.on{background:var(--accent)}
.age{font-family:var(--serif);color:var(--accent)}
.roaster{font-size:10.5px;letter-spacing:.2em;color:var(--accent)}
.bean h3{font-family:var(--serif);font-size:18px}

/* ── 레시피 ── */
.rec-grp h3{font-family:var(--serif);font-size:17px}
.rec-t h4{font-family:var(--serif);font-size:19px;font-weight:400}
.rec-b{border-radius:0;border:1px solid var(--line);font-size:10.5px}
.rec .fav{color:var(--accent)}
.rec-m b{font-size:10.5px;color:var(--dim)}
.rec-m span{font-family:var(--serif);font-size:14px}
.rec-p .pv{border-radius:0;font-size:11px;background:transparent}
.rec-p .pv i{color:var(--accent)}
.rec-act button{border-radius:0;border:0;border-bottom:1px solid var(--line);padding:0 0 2px;
  font-size:11.5px;color:var(--dim);background:transparent}
.rec-act button:hover{color:var(--accent);border-color:var(--accent);background:transparent}
.rec-tools button{border-radius:0;background:transparent;border:1px solid var(--line)}
.rec-tools button:hover{border-color:var(--accent);color:var(--accent)}
.umrow span{border-radius:0;background:var(--bg)}
.umrow i{font-family:var(--serif);color:var(--accent)}
.guidebtn{border-radius:0;border-color:var(--accent);color:var(--accent)}
.guidebtn:hover{background:var(--accent);color:#fff}

/* ── 버튼·폼·모달 ── */
.addbtn,.editbtn,.btn{border-radius:0;font-family:var(--sans)}
.addbtn{border:1px solid var(--line);background:transparent;color:var(--fg);font-size:12.5px;letter-spacing:.04em}
.addbtn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg);font-family:var(--serif);letter-spacing:.08em}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.addbtn.solid:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.editbtn{border-radius:0;border:1px solid var(--line);background:transparent;color:var(--dim)}
.editbtn:hover{border-color:var(--accent);color:var(--accent)}
.f label{font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.f input,.f select,.f textarea{border-radius:0;border:0;border-bottom:1px solid var(--line);
  background:transparent;font-family:var(--serif);font-size:16px;color:var(--fg);padding:8px 0}
.f textarea{border:1px solid var(--line);padding:10px;font-size:14px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:none;outline:none}
.f .hint,.hint2{font-size:10.5px;color:rgba(28,31,27,.34)}
.modal,.ovbox{border-radius:0;background:var(--bg);border:1px solid var(--fg)}
.modal-h h2,.ovh h3{font-family:var(--serif);font-weight:400}
.ovact button,.modal .save{border-radius:0}
.ovact button.solid{background:var(--fg);border-color:var(--fg)}
.ovact button.danger{background:#7A3B33;border-color:#7A3B33}
.tclock{font-family:var(--serif);font-weight:400}
.ts{border-radius:0}
.ts.now{border-color:var(--accent);background:rgba(140,122,75,.08)}
.pour-r input{border-radius:0}
.pour-r .pstir.on{background:var(--accent)}
.toast{border-radius:0;background:var(--fg);color:var(--bg);font-size:12.5px}
.empty h3{font-family:var(--serif)}
.ver-v{font-family:var(--serif)}

/* 단일 시트 페이지: 중복 제목 줄 제거 */
.acc.solo{border:0;background:transparent;margin:0}
.acc.solo>.acc-head{display:none}
.acc.solo>.acc-body{display:block;padding:0;border-top:0}
/* 시트 안쪽 요소들의 좌측 기준선 */
.gear-grp,.rec-grp,.quickadd,.beans,.gear,.recs,.tblwrap,.umtable,.empty{margin-left:0;margin-right:0}
.gear-grp h3,.rec-grp h3{padding-left:0}
.quickadd{padding-left:0}
/* 전체 보기에서의 아코디언 제목 줄 */
.acc{border:1px solid var(--line);background:var(--surface);margin:0 0 10px}
.acc-head{display:grid;grid-template-columns:auto auto minmax(0,1fr) 22px;align-items:center;
  gap:0 14px;padding:15px 20px;border-bottom:0;min-height:58px}
.acc.open>.acc-head{border-bottom:1px solid var(--line)}
.acc-head .aname{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:.01em;
  line-height:1.55;padding:2px 0}
.acc-head .acount{font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  background:transparent;border:1px solid var(--line);border-radius:0;padding:3px 9px;white-space:nowrap;
  justify-self:start;line-height:1.4}
.acc-head .adesc{font-size:11.5px;color:var(--dim);margin:0;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acc-head .chev{margin:0;font-size:10px;color:var(--dim);justify-self:end;line-height:1}
.acc-body{padding:6px 20px 24px}
/* 좌측 내비 */
.snav .navblock{margin-top:22px;padding-top:16px;border-top:1px solid var(--fg)}
.snav .navblock .navtitle{margin-bottom:6px}
.snav .navall{color:var(--fg)}
.snav button b{font-family:var(--serif);font-weight:400;color:var(--accent);font-size:11px;
  margin-right:8px;letter-spacing:.08em}
.snav .navall{color:var(--dim)}
.snav .navall em,.snav button em{font-family:var(--sans);font-size:11px;color:var(--dim)}

@media (max-width:700px){
  /* 상단 시트 목록: 줄바꿈으로 전부 노출 */
  .snav{flex-direction:row;flex-wrap:wrap;overflow:visible;gap:4px 6px;padding:12px 12px 10px;
    align-items:center;border-radius:0}
  .snav button{width:auto;white-space:nowrap;border:1px solid var(--line);border-left:1px solid var(--line);
    padding:7px 11px;font-size:12.5px;color:var(--fg);background:transparent}
  .snav button b{margin-right:6px}
  .snav button em{display:inline;margin-left:7px;font-size:10.5px}
  .snav button[aria-current="true"]{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:500}
  .snav .navblock{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding-top:9px;
    border-top:1px solid var(--line)}
  .snav .navblock .navtitle{display:block;margin:0;font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .snav .navback{width:auto;border:0;border-left:0;margin:0 0 0 auto;padding:7px 4px;color:var(--dim);font-size:11.5px}
  .topbar-in{padding:9px 15px;min-height:54px;gap:8px}
  .wordmark{font-size:19px;letter-spacing:.12em}
  .wordsub{display:none}
  .pillbtn{font-size:11px;padding:6px 9px}
  #bgmnext{padding:6px 8px}
  /* 표: 폭에 맞춰 고정 배치 + 저순위 열 숨김 (행을 누르면 상세에서 전부 확인) */
  .tbl{min-width:0;table-layout:fixed;width:100%}
  .tbl th,.tbl td{overflow:hidden}
  .tbl th:first-child,.tbl td:first-child{width:74px;font-size:12px}
  .tbl .bean-n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:keep-all;line-height:1.45}
  .tbl .bean-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl td.num,.tbl th.num{white-space:nowrap}
  /* 샷 로그: 비율 열 숨김 */
  #acc-p-esp .tbl th:nth-child(4),#acc-p-esp .tbl td:nth-child(4){display:none}
  /* 푸어 로그: 드리퍼·비율 열 숨김 */
  #acc-p-fil .tbl th:nth-child(3),#acc-p-fil .tbl td:nth-child(3),
  #acc-p-fil .tbl th:nth-child(5),#acc-p-fil .tbl td:nth-child(5){display:none}
  .tbl th:last-child,.tbl td:last-child{width:60px;text-align:right;white-space:nowrap}
  /* 펼침 상세 행은 폭 규칙에서 제외 */
  .tbl tr.det>td{width:auto;text-align:left;white-space:normal;overflow:visible;font-size:13px}
  .tbl tr.det>td:first-child{width:auto;font-size:13px}
  .acc.solo>.acc-body{padding:0}
  .gear-grp h3,.rec-grp h3{padding-left:0}
  .gi,.bean-c,.card,.rec{padding-left:16px;padding-right:16px}
  .tbl th{padding:0 10px 10px 0;font-size:10px;letter-spacing:.1em}
  .tbl td{padding:13px 10px 13px 0}
  .acc-head{grid-template-columns:1fr auto 20px;gap:0 10px;padding:13px 15px;min-height:52px}
  .acc-head .adesc{display:none}
  .acc-head .aname{font-size:16px}
  .acc-body{padding:6px 15px 20px}
  .wordsub{display:none}
}

/* 도록 선묘로 재조판: 굵은 채색 → 가는 단선 */
body.dark .plate-fig svg .gy{fill:rgba(230,231,225,.06)}
body.dark .plate-fig svg .dk,body.dark .plate-fig svg .dkS{fill:rgba(230,231,225,.12)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ══ 홈 — 계기판 ══
   모바일은 한 단으로 쌓고, 900px 위에서 좌측 시트 레일과 본문 두 단으로 나뉜다.
   마크업은 한 벌이고 배치만 바뀐다. */
.hm{display:flex;flex-direction:column;gap:16px;padding:16px 0 36px}
.hm-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.hm-card{background:var(--surface);border:1px solid var(--line);border-radius:4px}

.hm-read{padding:16px 17px 14px;display:flex;flex-direction:column;gap:13px}
.hm-rh{display:flex;align-items:flex-start;gap:10px}
.hm-rh>div{display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0}
.hm-eye{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.16em}
.hm-bean{font-size:17px;font-weight:600;letter-spacing:-.015em;color:var(--head)}
.hm-sub{font-size:11.5px;color:var(--dim)}
.hm-star{font-family:var(--mono);font-size:12px;color:var(--accent-ink);padding-top:14px;flex:none}
.hm-grid{display:flex;flex-direction:column;gap:13px}
.hm-chart{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:10px 14px 6px;
  display:flex;flex-direction:column;justify-content:center}
.pcurve,.scat{width:100%;display:block}
.pcurve text,.scat text{font-family:var(--mono)}
.scat text.kr,.pcurve text.kr{font-family:var(--sans)}
.hm-leg{display:flex;align-items:center;gap:7px;padding:4px 0 2px}
.hm-leg i{width:14px;height:2px;background:var(--accent);display:block;flex:none}
.hm-leg span{font-family:var(--mono);font-size:10px;color:var(--dim)}
.hm-vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hm-vals div{background:var(--surface2);padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.hm-vals b{font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.12em;font-weight:400}
.hm-vals i{font-style:normal;font-family:var(--mono);font-size:16px;font-weight:500;color:var(--head);
  font-variant-numeric:tabular-nums}
.hm-vals i u{text-decoration:none;font-size:10px;color:var(--dim)}
.hm-vals div.hot i{color:var(--accent-ink)}
.hm-memo{font-size:12.5px;color:var(--dim);line-height:1.6;border-left:2px solid var(--axis);
  padding-left:12px;margin:0}

.hm-plots{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hm-plot{padding:15px 16px 10px;display:flex;flex-direction:column;gap:9px}
.hm-plot h3{margin:0;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--head);
  display:flex;align-items:baseline;gap:9px;letter-spacing:0}
.hm-plot h3 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);
  letter-spacing:.12em;font-weight:400}
.hm-empty{font-size:12.5px;color:var(--dim);text-align:center;padding:34px 0;margin:0}

.hm-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hm-sum div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.hm-sum b{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.14em;font-weight:400}
.hm-sum i{font-style:normal;font-family:var(--mono);font-size:19px;font-weight:500;color:var(--head);
  font-variant-numeric:tabular-nums}
.hm-sum i u{text-decoration:none;font-size:12px;color:var(--dim)}
.hm-sum div.word i{font-family:var(--sans);font-size:15px;font-weight:600}
.hm-sum div.bad i{color:var(--danger)}

.hm-recs h3{margin:0 0 9px;padding-bottom:9px;border-bottom:1px solid var(--line);font-family:var(--sans);
  font-size:13px;font-weight:600;color:var(--num);display:flex;align-items:baseline;gap:10px;letter-spacing:0}
.hm-recs h3 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint);
  letter-spacing:.1em;font-weight:400}
.hm-th{display:none}
.hm-rec{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line-soft);color:inherit;font-family:var(--sans)}
.hm-rec:last-child{border-bottom:0}
.hm-rec:hover{background:var(--accent-wash)}
.hm-dt{font-family:var(--mono);font-size:11px;color:var(--dim);width:38px;flex:none;font-variant-numeric:tabular-nums}
.hm-body{flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hm-nm{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hm-nm em{font-style:normal;color:var(--dim);font-size:11.5px}
.hm-meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hm-rec .c{display:none}
.hm-rs{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none}
.hm-rs.top{color:var(--accent-ink)}
.hm-flag{font-family:var(--mono);font-size:9px;color:var(--danger);border:1px solid var(--danger);
  padding:1px 5px;border-radius:2px;letter-spacing:.06em;display:inline-block;margin-left:5px}

.hm-sheets{display:flex;flex-direction:column;gap:9px}
.hm-slab{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.2em}
.hm-slist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hm-sheet{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 11px;
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;min-height:44px;
  color:inherit;font-family:var(--sans)}
.hm-sheet .hs-no{display:none}
.hm-sheet .hs-bar{width:18px;height:3px;background:var(--accent);display:block;flex:none}
.hm-sheet.off .hs-bar{background:var(--line)}
.hm-sheet .hs-nm{font-size:12.5px;color:var(--fg)}
.hm-sheet.off .hs-nm{color:var(--dim)}
.hm-sheet .hs-ct{font-family:var(--mono);font-size:15px;color:var(--head);font-variant-numeric:tabular-nums}
.hm-sheet.off .hs-ct{color:var(--faint)}
.hm-sheet .hs-un{font-size:10px;color:var(--dim)}
.hm-scount{display:flex;align-items:baseline;gap:2px}
.hm-act{display:flex;gap:10px;padding-top:2px}
.hm-add{flex-grow:1;height:50px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--onaccent);border:0;border-radius:3px;font-size:15px;font-weight:600}
.hm-add:hover{filter:brightness(1.08)}
.hm-all{width:104px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:3px;
  border:1px solid var(--axis);background:none;color:var(--dim);font-size:13.5px;font-family:var(--sans)}
.hm-all:hover{border-color:var(--accent);color:var(--accent-ink)}

@media(min-width:900px){
  .hm{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start;padding-top:24px}
  .hm-sheets{order:-1;position:sticky;top:78px;gap:0}
  .hm-main{gap:20px}
  .hm-slab{display:none}
  .hm-slist{grid-template-columns:minmax(0,1fr);gap:0}
  .hm-sheet{flex-direction:row;align-items:center;gap:14px;padding:13px 12px;background:none;
    border:0;border-left:2px solid transparent}
  .hm-sheet .hs-bar{display:none}

  .hm-sub{font-size:12px}
  .hm-grid{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:24px;align-items:stretch}
  .hm-vals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hm-vals div{padding:11px 14px;gap:3px}
  .hm-vals i{font-size:20px}

  .hm-dt{width:auto;font-size:11.5px}

/* ══ 시트 페이지 — 계기판 ══
   홈과 같은 결로 맞춘다: 좌측 레일, 괘선 제목 줄, 등폭 수치 표. */
#page-sheets.on{grid-template-columns:280px minmax(0,1fr);gap:28px}

.snav{top:78px;gap:0;padding:24px 0 0;background:none;border:0}
.snav .navtitle{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint);
  text-transform:none;padding:0 12px 9px;margin:0}
.snav button{display:flex;align-items:center;gap:14px;width:100%;min-height:44px;padding:13px 12px;
  border:0;border-left:2px solid transparent;border-radius:3px;background:none;text-align:left;
  font-family:var(--sans);font-size:14px;font-weight:400;color:var(--num)}
.snav button i{display:none}
.snav button b{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--faint);width:18px;flex:none}
.snav button .sn-nm{flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snav button em{font-style:normal;font-family:var(--mono);font-size:15px;color:var(--head);
  margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.snav button:hover{background:var(--surface);border-left-color:var(--accent);color:var(--fg)}
.snav button[aria-current="true"]{background:var(--surface);border-left-color:var(--accent);
  color:var(--fg);font-weight:500}
.snav button[aria-current="true"] em{color:var(--accent-ink)}
.snav .navblock{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
.snav .navback{margin-top:10px;padding-top:14px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.snav .navback:hover{background:none;border-left-color:transparent;color:var(--accent-ink)}

.sheadwrap{padding:26px 0 15px;border-bottom:1px solid var(--line);margin-bottom:20px;
  display:flex;flex-direction:column;gap:7px}
.sheadwrap .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);
  text-transform:none;display:block}
.sheadwrap .hdot{display:none}
.sheadwrap h1{font-family:var(--sans);font-size:clamp(20px,2.6vw,25px);font-weight:600;
  letter-spacing:-.025em;margin:0;color:var(--head)}
.sheadwrap p{font-size:12.5px;color:var(--dim);line-height:1.7;max-width:62ch;margin:0;font-weight:400}
.exall{align-self:flex-start;margin-top:5px;background:none;border:1px solid var(--axis);border-radius:3px;
  font-family:var(--mono);font-size:11px;color:var(--dim);padding:8px 14px;letter-spacing:.06em}

.acc{border:1px solid var(--line);border-radius:4px;background:var(--surface);margin-bottom:14px}
.acc-head{padding:14px 16px;gap:12px}
.acc-head::before{display:none}
.acc-head .aname{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:-.01em}
.acc-head .acount{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:none;
  padding:0;border-radius:0}
.acc-head .adesc{font-size:11.5px;font-weight:400}
.acc-head:hover{background:var(--surface2)}
.acc.open>.acc-head{background:var(--surface2);border-bottom:1px solid var(--line)}
.acc-body{padding:2px 16px 20px}

.quickadd{padding:0 0 14px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:15px 17px 8px}
.chart-top{margin-bottom:6px;padding:0}
.charttitle{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.legend{font-size:10px;gap:13px}
.legend i.dash{border-color:var(--danger)}
.grid-l{stroke:var(--track)}
.axis-l{stroke:var(--axis);stroke-width:1.2}
.axis-t{font-family:var(--mono);font-size:10px;fill:var(--faint)}
.axis-title{font-family:var(--sans);font-size:10px;fill:var(--dim);letter-spacing:0;text-transform:none}
.dot-lab{font-family:var(--sans);font-size:10.5px;fill:var(--num)}
.flag-ring{stroke:var(--danger);stroke-width:2;stroke-dasharray:none}
.gap{height:16px}

.tblwrap{background:none;border:0;border-radius:0;padding:0}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);font-weight:400;
  padding:0 10px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.num{font-variant-numeric:tabular-nums}
.tbl .bean-n,.tbl .bean-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .bean-n{font-weight:500;letter-spacing:-.01em}
.tbl td:nth-child(2){min-width:150px;max-width:260px}

@media(max-width:899px){
  #page-sheets.on{grid-template-columns:minmax(0,1fr);gap:0}
  .snav{position:static;padding:14px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .snav .navtitle{display:none}
  .snav button{flex-direction:column;align-items:flex-start;gap:4px;padding:10px 11px;
    border:1px solid var(--line);border-left-width:1px;border-radius:3px;background:var(--surface);font-size:12.5px}
  .snav button b{width:auto;font-size:9px;letter-spacing:.12em}
  .snav button em{margin-left:0;font-size:15px}
  .snav button[aria-current="true"]{border-color:var(--accent)}
  .snav .navblock{grid-column:1/-1;margin:6px 0 0;padding:0;border:0}
  .snav .navblock .navtitle{display:none}
  .snav .navall,.snav .navback{flex-direction:row;align-items:center;border-top:0;margin:0;padding:12px;
    min-height:44px;background:none;border:1px solid var(--line)}
  .snav .navback{grid-column:1/-1;margin-top:8px;justify-content:center}
  .sheadwrap{padding:20px 0 13px}
  /* 760px 폭 좌표를 그대로 줄이면 눈금 글자가 4px가 된다. 같은 내용은 표에 있다. */
  .chart-card,.chart-card+.gap{display:none}
  /* 좁은 화면에서는 숨은 열이 많으므로 최소폭을 풀어 남은 열이 다 보이게 한다 */
  .tbl{min-width:0}
  .tbl td:nth-child(2){min-width:96px;max-width:none}
  .tbl th,.tbl td{padding-left:7px;padding-right:7px}
}

/* ══ 계기판 보정 ══
   어두운 바탕으로 바뀌면서 흰색이 박혀 있던 자리를 토큰으로 되돌린다. */
.save,.addbtn.solid,.seg button[aria-pressed="true"],.type-seg button[aria-pressed="true"],
.ovact button.solid{
  background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.save:hover,.addbtn.solid:hover,.ovact button.solid:hover{filter:brightness(1.08);color:var(--onaccent)}
.addbtn:hover{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--surface2)}
.chip.flag{background:none;border-color:var(--danger);color:var(--danger)}
.ovnum,.ritem .rkind,.chiprow button i svg,.promo.wide .wmark svg{color:var(--onaccent)}
.guidebtn:hover,.pour-r .pstir.on{color:var(--onaccent)}
.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.danger:hover{background:var(--danger);color:var(--onaccent);border-color:var(--danger)}
.toast{background:var(--accent);color:var(--onaccent)}
.sheet.all,.sheet.wide{background:var(--surface)}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <button class="mark" onclick="goHome()">
    <span class="wordmark">한잔록</span>
    <span class="wordsub">盞錄 · 한 잔의 기록</span>
  </button>
  <div class="topright">
    <button class="pillbtn" id="bgmbtn" onclick="toggleBgm()">🎵 음악</button>
    <button class="pillbtn" id="bgmnext" onclick="bgmNext()" title="다음 곡" aria-label="다음 곡">⏭</button>
    <button class="pillbtn" id="themebtn" onclick="toggleTheme()">🌙 다크</button>
  </div>
</div></header>
<main class="wrap">
  <div id="page-home" class="on">
    <div id="home"></div>
    <div class="homefoot">
      <p><button class="exportbtn" onclick="exportCSV()">⬇ 전체 기록 CSV 내보내기</button>
      <button class="syncbtn" onclick="openSync()">🔄 기기 간 동기화</button></p>
      <p><button class="verbtn" id="verbtn" onclick="openVer()"></button></p>
    </div>
  </div>

  <div id="page-sheets">
    <aside class="snav" id="snav"></aside>
    <div class="scontent" id="scontent"></div>
  </div>
</main>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="modal-h"><h2 id="mtitle">기록 추가</h2><button class="x" onclick="closeModal()" aria-label="닫기">✕</button></div>
    <div class="modal-b"><div class="type-seg" id="typeseg"></div><div id="formbox"></div></div>
    <div class="modal-f"><button class="save" onclick="saveRecord()">저장</button>
      <button class="ghost" onclick="closeModal()">취소</button>
      <button class="danger" id="delbtn" onclick="deleteRecord()" style="display:none">삭제</button>
      <span class="err" id="err"></span></div>
  </div>
</div>
<div class="scrim" id="csvbox" onclick="if(event.target===this)closeCsvBox()">
  <div class="modal" role="dialog" aria-modal="true" aria-label="CSV 내보내기">
    <div class="modal-h"><h2>전체 기록 CSV</h2><button class="x" onclick="closeCsvBox()" aria-label="닫기">✕</button></div>
    <div class="modal-b">
      <p class="csvmsg" id="csvmsg"></p>
      <textarea id="csvta" class="csvta" readonly spellcheck="false"></textarea>
    </div>
    <div class="modal-f">
      <button class="save" onclick="copyCsv()">전체 복사</button>
      <button class="ghost" onclick="closeCsvBox()">닫기</button>
    </div>
  </div>
</div>
<div class="scrim" id="syncbox" onclick="if(event.target===this)closeSync()">
  <div class="modal" role="dialog" aria-modal="true" aria-label="기기 간 동기화">
    <div class="modal-h"><h2>기기 간 동기화</h2><button class="x" onclick="closeSync()" aria-label="닫기">✕</button></div>
    <div class="modal-b">
      <p class="csvmsg">① 아래 코드를 복사해 카톡 '나에게 보내기' 등으로 다른 기기에 옮기고, ② 그 기기에서 이 창을 열어 붙여넣으면 된다.</p>
      <div class="synclabel">이 기기의 코드</div>
      <textarea id="syncout" class="csvta sync" readonly spellcheck="false"></textarea>
      <div class="syncrow"><button class="save" onclick="copySync()">코드 복사</button></div>
      <div class="synclabel" style="margin-top:18px">다른 기기의 코드 붙여넣기</div>
      <textarea id="syncin" class="csvta sync" spellcheck="false" placeholder="BA1: 으로 시작하는 코드"></textarea>
      <div class="syncrow">
        <button class="save" onclick="importSync('merge')">합치기 (권장)</button>
        <button class="ghost" onclick="importSync('replace')">전체 교체</button>
        <span class="err" id="syncerr"></span>
      </div>
      <p class="csvmsg" style="margin-top:10px">합치기는 이 기기에 없는 기록만 추가한다 · 교체는 이 기기 기록을 코드 내용으로 덮어쓴다</p>
    </div>
  </div>
</div>
<div class="scrim" id="verbox" onclick="if(event.target===this)closeVer()">
  <div class="modal" role="dialog" aria-modal="true" aria-label="버전 기록">
    <div class="modal-h"><h2>버전 기록</h2><button class="x" onclick="closeVer()" aria-label="닫기">✕</button></div>
    <div class="modal-b"><div id="verlist"></div></div>
    <div class="modal-f"><button class="ghost" onclick="closeVer()">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============ 시트 데이터 (예시 행 3건 제외) ============ */
/* ---- 레시피 프리셋 ---- */
const RECIPE_PRESETS=[
  {name:"라이트 게이샤 ES",cat:"에스프레소",beanType:"라이트",dose:16.5,yield:45,dial:"0.8",temp:93,
   basket:"IMS H24.5M",pi:10,piBar:4,bar:6.5,total:"0:33",fav:true,
   memo:"프리인퓨전을 길게 잡아 채널링을 억제. 본압은 낮게."},

 "0:5":["0:8"],"0:6":["0:9"],"0:7":["0:10"],"0:8":["0:11"],"0:9":["0:12"],
 "1:0":["1:0","1:1","1:2","1:3","1:4"],"1:1":["1:5"],"1:2":["1:6"],"1:3":["1:7"],
 "2:0":["2:0","2:1"],"2:1":["2:2"]};
function migrateGearEdits(ed){
  const out={};
  for(const key in ed){
    const map=GEAR_MIG[key];
    if(!map){out[key]=ed[key];continue}
    if(map.length===1){out[map[0]]=ed[key]}
    else if(ed[key]&&ed[key].__deleted){map.forEach(nk=>out[nk]={__deleted:true})}
  }
  return out;
}
function kindList(){
  const seen=new Set();const out=[];
  const push=(k)=>{const key=String(k).replace(/\s/g,"");if(k&&!seen.has(key)){seen.add(key);out.push(k)}};
  GEAR.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const ed=USER.gearEdits[gi+":"+ii];
    if(ed&&ed.__deleted) return;
    push((ed||it).k);
  }));
  USER.gearKinds.forEach(x=>push(x.k));
  USER.gear.forEach(u=>push(u.k));
  return out;
}
function gearNamesBy(sub){
  const key=String(sub).replace(/\s/g,"");
  const {cards,order,orphans}=gearCardData();
  const out=[];
  const add=n=>{n=String(n).trim();if(n&&!out.includes(n))out.push(n)};
  order.forEach(ck=>{const c=cards[ck];
    if(String(c.k).replace(/\s/g,"").includes(key))
      c.prods.forEach(p=>String(p.n).split("·").forEach(add));
  });
  orphans.forEach(u=>{if(String(u.k).replace(/\s/g,"").includes(key))String(u.n).split("·").forEach(add)});
  return out;
}

  return all(key).length;
}

const mmss=s=>{s=Number(s)||0;return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const stars=n=>{n=Number(n)||0;return "★".repeat(n)+"<b>"+"★".repeat(5-n)+"</b>"};
const dOnly=x=>{const d=(x instanceof Date)?x:new Date(x);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())};
const days=(a,b)=>Math.round((dOnly(b)-dOnly(a))/864e5);

let openIds=new Set(), focusId=null;
function setAccent(c){document.documentElement.style.setProperty("--accent",c)}
function sheetById(id){return SHEETS.find(x=>x.id===id)}


/* 순수 화면 전환 (히스토리 없음) */
function showSheets(id){
  focusId=id||null;
  openIds = id ? new Set([id]) : new Set(SHEETS.map(x=>x.id));
  renderSheetsPage();
  document.getElementById("page-home").classList.remove("on");
  document.getElementById("page-sheets").classList.add("on");
  setAccent(id?sheetById(id).color:GOLD);
  window.scrollTo({top:0,behavior:"auto"});
  if(id) setTimeout(()=>{
    const el=document.getElementById("acc-"+id);
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  },60);
}
function showHome(){
  document.getElementById("page-home").classList.add("on");
  document.getElementById("page-sheets").classList.remove("on");
  setAccent(GOLD);
  window.scrollTo({top:0,behavior:"smooth"});
}
/* 시트별 주소 — 각 시트가 독립 페이지처럼 열리고 뒤로가기로 색인 복귀 */
function hashOf(id){const s=sheetById(id);return s?"#"+s.key:"#all"}
function idOfHash(h){
  h=String(h||"").replace("#","");
  if(!h||h==="home") return undefined;
  if(h==="all"||h==="sheets") return null;
  const s=SHEETS.find(x=>x.key===h);
  return s?s.id:undefined;
}
function openSheets(id){
  const h=id?hashOf(id):"#all";
  try{ if(location.hash!==h) history.pushState({p:h},"",h); }catch(e){}
  showSheets(id);
  try{const s=id?sheetById(id):null;
    document.title=(s?s.name:"전체 보기")+" · 한잔록";}catch(e){}
}
function goHome(){
  try{document.title="한잔록 — 한 잔의 기록"}catch(e){}
  /* 시트에서 로고/메뉴로 메인 이동 시 히스토리도 한 칸 되돌린다 */
  if(location.hash&&history.state&&history.state.p===location.hash){
    try{history.back();return}catch(e){}
  }
  try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  showHome();
}
if(typeof window!=="undefined"&&window.addEventListener){
  window.addEventListener("popstate",()=>{
    const id=idOfHash(location.hash);
    if(id===undefined) showHome(); else showSheets(id);
  });
  /* 주소로 직접 진입·새로고침한 경우 해당 시트 복원 */
  if(typeof location!=="undefined"&&location.hash){
    const id0=idOfHash(location.hash);
    if(id0!==undefined) try{setTimeout(()=>showSheets(id0),0)}catch(e){}
  }
}
function toggleSec(id){
  if(openIds.has(id)) openIds.delete(id); else {openIds.add(id);focusId=id;setAccent(sheetById(id).color)}
  applyOpen();
}
function expandAll(){
  const allOpen=openIds.size===SHEETS.length;
  openIds = allOpen ? new Set() : new Set(SHEETS.map(x=>x.id));
  focusId = allOpen ? null : focusId;
  if(allOpen) setAccent(GOLD);
  applyOpen();
}
function applyOpen(){
  SHEETS.forEach(x=>{
    const el=document.getElementById("acc-"+x.id);
    if(el) el.classList.toggle("open",openIds.has(x.id));
    const nav=document.getElementById("nav-"+x.id);
    if(nav) nav.setAttribute("aria-current",focusId===x.id);
  });
  const btn=document.getElementById("exall");
  if(btn) btn.textContent = openIds.size===SHEETS.length ? "전부 접기" : "전부 펼치기";
}

/* ============ 산포도 ============ */
function scatter(rows,cfg){
  const W=760,H=320,P={l:56,r:24,t:28,b:46};
  if(!rows.length) return `<p class="nodata">표시할 데이터가 없다.</p>`;
  const xs=rows.map(cfg.x),ys=rows.map(cfg.y);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const padx=(x1-x0||cfg.dx)*.28+cfg.dx*.1, pady=(y1-y0||cfg.dy)*.28+cfg.dy*.1;
  x0-=padx;x1+=padx;y0=Math.max(0,y0-pady);y1+=pady;
  const px=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r);
  const py=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.aria}">`;
  for(let i=0;i<=4;i++){
    const yv=y0+(y1-y0)*i/4, xv=x0+(x1-x0)*i/4;
    s+=`<line class="grid-l" x1="${P.l}" y1="${py(yv).toFixed(1)}" x2="${W-P.r}" y2="${py(yv).toFixed(1)}"/>`;
    s+=`<text class="axis-t" x="${P.l-10}" y="${(py(yv)+3.5).toFixed(1)}" text-anchor="end">${cfg.fy(yv)}</text>`;
    s+=`<line class="grid-l" x1="${px(xv).toFixed(1)}" y1="${P.t}" x2="${px(xv).toFixed(1)}" y2="${H-P.b}"/>`;
    s+=`<text class="axis-t" x="${px(xv).toFixed(1)}" y="${H-P.b+17}" text-anchor="middle">${cfg.fx(xv)}</text>`;
  }
  s+=`<line class="axis-l" x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}"/>`;
  s+=`<line class="axis-l" x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}"/>`;
  s+=`<text class="axis-title" x="${W-P.r}" y="${H-6}" text-anchor="end">${cfg.xl}</text>`;
  s+=`<text class="axis-title" x="${P.l-10}" y="12" text-anchor="end">${cfg.yl}</text>`;
  rows.forEach(r=>{
    const cx=px(cfg.x(r)),cy=py(cfg.y(r)),rad=5+(Number(r.rating)||3)*1.7;
    if(r.channel) s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad+6).toFixed(1)}" fill="none" class="flag-ring"/>`;
    s+= cfg.hollow
      ? `<circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="2.4"><title>${esc(r.bean)} · ${r.date} · ★${r.rating}</title></circle>`
      : `<circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="var(--accent)" fill-opacity=".85"><title>${esc(r.bean)} · ${r.date} · ★${r.rating}</title></circle>`;
    const flip=cx>W-190;
    s+=`<text class="dot-lab" x="${(cx+(flip?-rad-9:rad+9)).toFixed(1)}" y="${(cy+3.5).toFixed(1)}" text-anchor="${flip?"end":"start"}">${esc(plotLabel(r.bean))}</text>`;
  });
  return s+`</svg>`;
}

function radar(c){
  const S=290,cx=S/2,cy=S/2,R=98,n=CUP_ITEMS.length;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  let s=`<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="커핑 항목별 점수 레이더">`;
  [.25,.5,.75,1].forEach(f=>{
    s+=`<polygon points="${CUP_ITEMS.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" class="grid-l"/>`;});
  CUP_ITEMS.forEach((_,i)=>{const[x,y]=pt(i,1);s+=`<line class="grid-l" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`});
  const norm=v=>Math.max(0,(num(v)-6)/4);
  s+=`<polygon points="${CUP_ITEMS.map(([k],i)=>pt(i,norm(c[k])).map(v=>v.toFixed(1)).join(",")).join(" ")}"
        fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="1.8"/>`;
  CUP_ITEMS.forEach(([k],i)=>{const[x,y]=pt(i,norm(c[k]));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="var(--accent)"/>`});
  CUP_ITEMS.forEach(([k,label],i)=>{const[x,y]=pt(i,1.26);
    s+=`<text class="axis-t" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle">${label} ${num(c[k]).toFixed(2)}</text>`;});
  return s+`</svg>`;
}

      <div class="rl">${ROASTS.map((_,i)=>`<i class="${i<=lv?"on":""}"></i>`).join("")}<span>${esc(b.roast)}</span></div>
      ${b.__edited?'<div class="editedmark">수정됨</div>':""}
    </article>`}).join("")}</div>`;
}
/* 장비 개별 스펙(구입일·Δ값·니들) 요약 표시 */
function gearSpec(x){
  if(!x) return "";
  const b=[];
  if(x.buy) b.push("구입 "+x.buy);
  if(x.delta!=null&&x.delta!=="") b.push("Δ "+x.delta);
  if(x.needle!=null&&x.needle!=="") b.push("니들 "+x.needle+"mm"+(x.trim?" ("+x.trim+")":""));
  return b.length?`<span class="g-spec">${esc(b.join(" · "))}</span>`:"";
}
function gearCardData(){
  const cards={};const order=[];
  const mkCard=(grp,k)=>{const ck=grp+"||"+String(k).replace(/\s/g,"");
    if(!cards[ck]){cards[ck]={ck,grp,k,prods:[],ms:[],ki:null};order.push(ck)}
    return cards[ck];};
  GEAR.forEach((g,gi)=>{
    g.items.forEach((it,ii)=>{
      const ed=USER.gearEdits[gi+":"+ii];
      if(ed&&ed.__deleted) return;
      const item=ed||it;
      const c=mkCard(g.grp,item.k);
      c.prods.push({id:"s:"+gi+":"+ii,n:item.n,key:gi+":"+ii,seed:true,edited:!!ed,x:item});
      if(item.m)c.ms.push(item.m);
    });
  });
  order.forEach(ck=>{const c=cards[ck];
    const mm=USER.kindMeta[String(c.k).replace(/\s/g,"")];
    if(mm&&mm.m&&!c.ms.includes(mm.m))c.ms.push(mm.m);});
  USER.gearKinds.forEach((x,ki)=>{
    const c=mkCard(x.grp||"공통",x.k);
    if(c.ki==null)c.ki=ki;
    if(x.m&&!c.ms.includes(x.m))c.ms.push(x.m);
  });
  const orphans=[];
  USER.gear.forEach((u,ui)=>{
    const key=String(u.k).replace(/\s/g,"");
    let hit=null;
    for(const ck of order){if(String(cards[ck].k).replace(/\s/g,"")===key){hit=cards[ck];break}}
    if(hit){hit.prods.push({id:"u:"+ui,n:u.n,ui,seed:false,x:u})}
    else orphans.push({...u,__ui:ui});
  });
  /* 저장된 순서 적용: 알려진 id 우선, 새 항목은 뒤에 원래 순서로 */
  order.forEach(ck=>{
    const saved=USER.gearOrder[ck];
    if(!saved) return;
    const c=cards[ck];
    c.prods.sort((a,b)=>{
      const ia=saved.indexOf(a.id),ib=saved.indexOf(b.id);
      return (ia<0?saved.length:ia)-(ib<0?saved.length:ib);
    });
  });
  return {cards,order,orphans};
}
async function saveGearOrder(ck,ids,rerender){
  USER.gearOrder[ck]=ids;
  if(!await persist()) toast("순서를 화면에는 반영했지만 저장에 실패했다");
  if(rerender) renderEverything();
}

/* ============ 장비 순서: 꾹 눌러 드래그 ============ */
let dragCtx=null,pressTimer=null,pressStart=null;
function beginGearDrag(li,e){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
  const ul=li.parentElement;
  dragCtx={li,ul,ck:li.dataset.ck};
  li.classList.add("drag-active");
  document.body.classList.add("drag-lock");
  try{li.setPointerCapture&&li.setPointerCapture(e.pointerId)}catch(_){}
  if(navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
}
function endGearDrag(save){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
  pressStart=null;
  if(!dragCtx) return;
  const {ul,li,ck}=dragCtx;
  li.classList.remove("drag-active");
  document.body.classList.remove("drag-lock");
  dragCtx=null;
  if(save){
    const ids=[...ul.querySelectorAll("li[data-pid]")].map(x=>x.dataset.pid);
    saveGearOrder(ck,ids,false); /* 화면은 그대로 두고 조용히 저장 → 바로 다음 줄을 이어서 옮길 수 있다 */
  }else{
    renderEverything();
  }
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("pointerdown",e=>{
    const li=e.target.closest&&e.target.closest(".g-prod li[data-pid]");
    if(!li) return;
    if(e.target.closest("button")) return;
    if(e.target.closest(".grip")){e.preventDefault();beginGearDrag(li,e);return}
    pressStart={x:e.clientX,y:e.clientY};
    pressTimer=setTimeout(()=>{beginGearDrag(li,e)},420);
  });
  document.addEventListener("pointermove",e=>{
    if(pressTimer&&pressStart&&(Math.abs(e.clientX-pressStart.x)>8||Math.abs(e.clientY-pressStart.y)>8)){
      clearTimeout(pressTimer);pressTimer=null;pressStart=null;
    }
    if(!dragCtx) return;
    e.preventDefault();
    const y=e.clientY;
    const sibs=[...dragCtx.ul.querySelectorAll("li[data-pid]")].filter(x=>x!==dragCtx.li);
    let before=null;
    for(const s of sibs){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}
    if(before) dragCtx.ul.insertBefore(dragCtx.li,before);
    else dragCtx.ul.appendChild(dragCtx.li);
  },{passive:false});
  document.addEventListener("pointerup",()=>{if(dragCtx)endGearDrag(true);else if(pressTimer){clearTimeout(pressTimer);pressTimer=null;pressStart=null}});
  document.addEventListener("pointercancel",()=>{endGearDrag(false)});
}
