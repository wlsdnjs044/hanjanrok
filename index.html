/* ── 추출 압력 곡선 ──
   기록된 프리인퓨전 시간·압력, 본압, 추출시간만으로 그린다.
   유량은 앱이 재지 않으므로 그리지 않는다. */
function pressureSvg(r){
  const t=num(r.time), bar=num(r.bar), pi=num(r.pi), piBar=num(r.piBar);
  if(!(t>0&&bar>0)) return "";
  const X0=40,X1=606,Y0=124,YT=34, top=Math.max(10,Math.ceil(bar));
  const sx=v=>X0+(Math.max(0,Math.min(v,t))/t)*(X1-X0);
  const sy=v=>Y0-(Math.max(0,v)/top)*(Y0-YT);
  const pts=[[0,0]];
  if(pi>0&&piBar>0) pts.push([pi*0.3,piBar*0.6],[pi*0.65,piBar],[pi,piBar],[Math.min(pi+1.6,t*0.9),bar]);
  else pts.push([Math.min(2,t*0.2),bar]);
  pts.push([t*0.5,bar],[t*0.78,bar*0.95],[t,bar*0.87]);
  const d=pts.map((q,k)=>(k?"L":"M")+sx(q[0]).toFixed(1)+" "+sy(q[1]).toFixed(1)).join(" ");
  const band=pi>0?`<rect x="${X0}" y="8" width="${(sx(pi)-X0).toFixed(1)}" height="${Y0-8}" fill="var(--accent)" opacity=".07"/>
    <text x="${X0+6}" y="21" fill="var(--dim)" font-size="9" letter-spacing="0.1em">PI ${pi}s${piBar?" · "+piBar+" bar":""}</text>`:"";
  const mid=Math.round(t/2);
  return `<svg viewBox="0 0 620 150" class="pcurve" role="img" aria-label="추출 압력 곡선 — 최고 ${bar}바, 총 ${t}초">
    <line x1="${X0}" y1="8" x2="${X0}" y2="${Y0}" stroke="var(--axis)" stroke-width="1"/>
    <line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="var(--axis)" stroke-width="1"/>
    <line x1="${X0}" y1="${YT}" x2="${X1}" y2="${YT}" stroke="var(--track)" stroke-width="1" stroke-dasharray="2 5"/>
    <line x1="${X0}" y1="${(YT+Y0)/2}" x2="${X1}" y2="${(YT+Y0)/2}" stroke="var(--track)" stroke-width="1" stroke-dasharray="2 5"/>
    <text x="32" y="16" text-anchor="end" fill="var(--dim)" font-size="9">bar</text>
    <text x="32" y="38" text-anchor="end" fill="var(--faint)" font-size="9">${top}</text>
    <text x="32" y="${((YT+Y0)/2+4)}" text-anchor="end" fill="var(--faint)" font-size="9">${top/2}</text>
    <text x="32" y="128" text-anchor="end" fill="var(--faint)" font-size="9">0</text>
    ${band}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(t).toFixed(1)}" cy="${sy(bar*0.87).toFixed(1)}" r="3.2" fill="var(--accent)"/>
    <text x="${X0}" y="142" fill="var(--faint)" font-size="9">0s</text>
    <text x="${sx(mid).toFixed(1)}" y="142" text-anchor="middle" fill="var(--faint)" font-size="9">${mid}s</text>
    <text x="${X1}" y="142" text-anchor="end" fill="var(--faint)" font-size="9">${t}s</text>
  </svg>`;
}

/* ── 산점도 ── 추출시간 × 별점.
   시간 축은 기록 범위에 맞춰 잡는다. 샷과 푸어는 단위가 열 배 넘게 달라 판을 따로 쓴다. */
/* 점 옆 이름은 판을 넘지 않게 줄인다 — 전체 이름은 아래 표에 있다 */
const plotLabel=t=>{t=String(t||"—");return t.length>11?t.slice(0,10)+"…":t};
function scatterSvg(rows,fmt,hue){
  const pts=rows.filter(r=>num(r.rating)>0&&num(r.x)>0);
  if(!pts.length) return `<p class="hm-empty">별점이 매겨진 기록이 쌓이면 여기에 찍힌다</p>`;
  const X0=44,X1=384,Y5=36,Y1=190;
  const xs=pts.map(q=>num(q.x));
  let lo=Math.min.apply(null,xs), hi=Math.max.apply(null,xs);
  const pad=Math.max((hi-lo)*0.28, hi*0.1, 1);
  lo=Math.max(0,lo-pad); hi=hi+pad;
  const sx=v=>X0+((v-lo)/(hi-lo))*(X1-X0);
  const sy=v=>Y1-((v-1)/4)*(Y1-Y5);
  const grid=[5,4,3,2].map(v=>`<line x1="${X0}" y1="${sy(v).toFixed(1)}" x2="${X1}" y2="${sy(v).toFixed(1)}" stroke="var(--track)" stroke-width="1"/>`).join("");
  const ylab=[5,4,3,2,1].map(v=>`<text x="36" y="${(sy(v)+4).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="10">${v}</text>`).join("");
  const marks=pts.map(q=>{
    const cx=sx(num(q.x)), cy=sy(num(q.rating)), best=num(q.rating)>=5;
    const anchor=cx>X1-64?"end":(cx<X0+64?"start":"middle");
    const ty=cy>Y5+24?cy-12:cy+21;
    const dot=q.flag
      ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="var(--surface)" stroke="var(--danger)" stroke-width="2"/>`
      : `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${best?8.5:7}" fill="var(--${hue})"/>`;
    const col=q.flag?"danger":(best?"head":"num");
    return dot+`<text class="kr" x="${cx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" fill="var(--${col})" font-size="10.5">${esc(plotLabel(q.label))}${q.flag?" · 채널링":""}</text>`;
  }).join("");
  return `<svg viewBox="0 0 400 230" class="scat" role="img" aria-label="추출시간과 별점 산점도, 기록 ${pts.length}건">
    ${grid}
    <line x1="${X0}" y1="20" x2="${X0}" y2="${Y1}" stroke="var(--axis)" stroke-width="1.2"/>

/* 기록 한 줄이 쓰는 값 — 샷과 푸어의 항목 이름이 달라 여기서 맞춘다 */
function homeRow(r){
  const esp=r.__t==="espresso";
  const dose=num(r.dose), out=esp?num(r.yield):num(r.water), t=esp?num(r.time):num(r.total);
  return {esp, dose, out, t,
    ratio: dose&&out ? "1:"+(out/dose).toFixed(1) : "—",
    temp: r.temp!=null&&r.temp!=="" ? num(r.temp)+"°" : "—",
    time: t ? mmss(t) : "—"};
}

function renderHome(){
  const e=all("espresso"), f=all("filter"), beans=beansAll();

    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const openDays=(bean&&bean.open&&lastEsp.date)?days(bean.open,lastEsp.date):null;

          <div><b>TEMP</b><i>${g.temp}</i></div>
          <div><b>GRIND</b><i>${esc(lastEsp.grind||"—")}</i></div>
        </div>
      </div>
      ${lastEsp.memo?`<p class="hm-memo">${esc(lastEsp.memo)}</p>`:""}
    </section>`;
  }

  const espPts=e.map(r=>({label:r.bean||"—",x:num(r.time),rating:num(r.rating),flag:!!r.channel}));
  const filPts=f.map(r=>({label:r.bean||"—",x:num(r.total),rating:num(r.rating),flag:false}));
  const secFmt=v=>Math.round(v)+"s";
  const minFmt=v=>mmss(Math.round(v));

  /* 원두 아카이브 기준 최다 로스터리 */
  const byR={}; beans.forEach(x=>{if(x.roaster)byR[x.roaster]=(byR[x.roaster]||0)+1});
  const topR=Object.keys(byR).sort((a,b)=>byR[b]-byR[a])[0];
  const gap=rows[0]&&rows[0].date?days(rows[0].date,new Date()):null;

  const recs=rows.slice(0,5).map(r=>{
    const g=homeRow(r);
    const best=num(r.rating)>=5;
    return `<button class="hm-rec" onclick="openEdit('${r.__t}',${srcOf(r)})">
      <span class="hm-dt">${esc((r.date||"").slice(5))}</span>
      <span class="hm-body">
        <span class="hm-nm">${esc(r.bean||"—")} <em>· ${g.esp?"샷":"푸어"}</em>${r.channel?`<span class="hm-flag">채널링</span>`:""}</span>

  document.getElementById("home").innerHTML=`
  <div class="hm">
    <div class="hm-main">
      ${read||`<section class="hm-card hm-read"><p class="hm-empty">첫 기록을 남기면 여기에 판독이 뜬다</p></section>`}

      <div class="hm-plots">

}

  if(x.id==="p-cup")  return secHead("커핑 노트","SCA 스타일 · 주요 8항목 6.00~10.00 (0.25 단위)")+secCupping();

}

  let rec;

  else if(type==="gear"){
    if(scope==="seed"){
      const [gi,ii]=String(idx).split(":").map(Number);
      rec=USER.gearEdits[idx]||GEAR[gi].items[ii];
    } else rec=USER.gear[idx];
  } else if(type==="beans"&&scope==="seed"){rec=USER.edits.beans[idx]||SEED.beans[idx];}
  else if(scope==="seed"){rec=USER.edits[type][idx]||SEED[type][idx];}
  else {rec=USER[type][idx];}

const V=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
const N=id=>{const v=V(id);return v===""?null:Number(v)};
function sec(v){
  v=String(v).trim();if(!v)return 0;
  if(v.includes(":")){const[m,s]=v.split(":");return Number(m)*60+Number(s)}
  const n=Number(v);if(!isFinite(n))return 0;
  return n>=100?Math.floor(n/100)*60+(n%100):n;
}
async function saveRecord(){
  const err=document.getElementById("err");err.textContent="";

    rec={k:V("f_gk")||"기타",n:V("f_gn")}; /* m 미포함 — 병합 시 기존 비고 보존 */
    /* 선택 항목은 입력된 것만 병합 (빈 값으로 기존 데이터를 덮지 않음) */
    if(V("f_gbuy")) rec.buy=V("f_gbuy");
    if(V("f_gdelta")!=="") rec.delta=N("f_gdelta");
    if(V("f_gneedle")!=="") rec.needle=N("f_gneedle");
    if(V("f_gtrim")) rec.trim=V("f_gtrim");
  }else if(formType==="gearkind"){
    if(!V("f_kk")){err.textContent="구분명을 입력해줘";return}
    rec={grp:V("f_kg")||"공통",k:V("f_kk"),m:V("f_km")};
  }else if(formType==="recipes"){
    if(!V("f_rname")){err.textContent="레시피 이름을 입력해줘";return}
    const prev=(editRef&&editRef.orig)?(()=>{const c={...editRef.orig};
      delete c.hist;delete c.__seed;delete c.__user;delete c.__edited;return c})():null;
    const hist=editRef?[...((editRef.orig&&editRef.orig.hist)||[]),{ts:todayStr(),snap:prev}].slice(-10)
      :((editRef&&editRef.orig&&editRef.orig.hist)||[]);
    rec={name:V("f_rname"),cat:V("f_rcat")||"시그니처",beanType:V("f_rbean")||"전체",
         dose:N("f_rdose"),yield:N("f_ryield"),dial:V("f_rdial"),temp:N("f_rtemp"),
         total:V("f_rtotal"),um:N("f_rum"),basket:pickVal("f_rbasket"),pi:N("f_rpi"),piBar:N("f_rpibar"),
         bar:N("f_rbar"),dripper:pickVal("f_rdripper"),bloom:N("f_rbloom"),
         pours:pourCollect(),fav:!!V("f_rfav"),memo:V("f_rmemo"),hist:hist};
  }else if(formType==="beans"){
    if(!V("f_name")){err.textContent="원두명을 입력해줘";return}
    rec={name:V("f_name"),roaster:V("f_roaster")||"—",origin:V("f_origin")||"—",process:V("f_process")||"—",
         variety:V("f_variety")||"—",roast:V("f_roast"),roastdate:V("f_roastdate"),buy:V("f_buy"),open:V("f_open"),
         shop:V("f_shop")||"—",note:V("f_note")};
  }else{
    if(!V("f_date")||!beanVal()){err.textContent="날짜와 원두는 필수야";return}
    const base={date:V("f_date"),bean:beanVal(),roaster:V("f_roaster")||"—",roast:V("f_roast")};
    if(formType==="espresso"){
      if(!N("f_dose")||!N("f_yield")||!N("f_time")){err.textContent="도징 · 추출량 · 추출시간은 필수야";return}
      rec={...base,grind:V("f_grind")||"—",dose:N("f_dose"),yield:N("f_yield"),pi:N("f_pi")??0,
           piBar:N("f_pibar")??0,bar:N("f_bar")??0,basket:pickVal("f_basket")||"—",time:N("f_time"),
           temp:N("f_temp"),channel:Number(V("f_channel")||0),acid:N("f_acid"),sweet:N("f_sweet"),
           body:N("f_body"),rating:N("f_rating")??3,memo:V("f_memo"),
           burrKg:N("f_burr"),rdt:!!V("f_rdt"),wdtType:V("f_wdt"),wdtSec:N("f_wdtsec"),grindUm:N("f_grindum")};
    }else if(formType==="filter"){
      if(!N("f_dose")||!N("f_water")){err.textContent="도징과 물량은 필수야";return}
      rec={...base,dripper:pickVal("f_dripper"),grind:V("f_grind")||"—",dose:N("f_dose"),water:N("f_water"),burrKg:N("f_burr"),grindUm:N("f_grindum"),
           temp:N("f_temp"),bloom:N("f_bloom"),pour:sec(V("f_pour")),total:sec(V("f_total")),
           acid:N("f_acid"),sweet:N("f_sweet"),body:N("f_body"),rating:N("f_rating")??3,memo:V("f_memo")};
    }else{
      rec={...base,notes:V("f_notes"),uni:N("f_uni")??0,clean:N("f_clean")??0,
           sweetn:N("f_sweetn")??0,defect:N("f_defect")??0};
      CUP_ITEMS.forEach(([k])=>rec[k]=N("f_"+k)??6);
    }
  }
  const dest=formType;
  if(editRef){
    const merged={...editRef.orig,...rec};
    delete merged.__seed;delete merged.__user;delete merged.__edited;delete merged.__gk;delete merged.__ui;delete merged.mine;delete merged.__ki;
    if(dest==="gearkind"){
      if(editRef.scope==="meta") USER.kindMeta[editRef.idx]={m:V("f_km")};
      else{
        const old=USER.gearKinds[editRef.idx]||{};
        const on=String(old.k||"").replace(/\s/g,""), nn=String(merged.k||"").replace(/\s/g,"");
        if(on&&(on!==nn||old.grp!==merged.grp)){
          USER.gear.forEach(u=>{if(String(u.k).replace(/\s/g,"")===on)u.k=merged.k});

          if(USER.gearOrder[oldCk]){USER.gearOrder[newCk]=USER.gearOrder[oldCk];delete USER.gearOrder[oldCk]}
        }

      else USER.gear[editRef.idx]=merged;
    }else if(editRef.scope==="seed"){
      USER.edits[dest][editRef.idx]=merged;
    }else{
      USER[dest][editRef.idx]=merged;
    }
  }else{
    if(dest==="gearkind") USER.gearKinds.push(rec);
    else USER[dest].push(rec);
  }

  openSheets({beans:"p-bean",cupping:"p-cup",espresso:"p-esp",filter:"p-fil",recipes:"p-rec",gear:"p-gear",gearkind:"p-gear"}[dest]);
}
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2400);
}
async function deleteRecord(){
  if(!editRef) return;
  if(!await askConfirm("이 기록을 삭제한다. 되돌릴 수 없다.","삭제")) return;
  const {type,scope,idx}=editRef;
  if(type==="gearkind"){
    if(scope==="meta") delete USER.kindMeta[idx];
    else USER.gearKinds.splice(idx,1);
  }else if(type==="gear"){
    if(scope==="seed") USER.gearEdits[idx]={__deleted:true};
    else USER.gear.splice(idx,1);
  }else if(scope==="seed"){
    USER.edits[type][idx]={__deleted:true};
  }else{
    USER[type].splice(idx,1);
    if(type==="gear"){
      for(const ck in USER.gearOrder){
        USER.gearOrder[ck]=USER.gearOrder[ck]
          .filter(id=>id!=="u:"+idx)
          .map(id=>{if(id.startsWith("u:")){const n=+id.slice(2);return n>idx?"u:"+(n-1):id}return id});
      }
    }
  }
  editRef=null;
  const ok=await persist();
  closeModal();renderEverything();
  toast(ok?"기록을 삭제했다":"화면에는 반영했지만 저장에 실패했다");
}

function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvRows(rows){return rows.map(r=>r.map(csvCell).join(",")).join("\n")}
function exportCSV(){
  const E=all("espresso"),F=all("filter"),C=all("cupping"),B=beansAll();
  const gearFlat=[];
  const tmp=GEAR.map((g,gi)=>g.items.map((it,ii)=>{
    const ed=USER.gearEdits[gi+":"+ii];
    return ed&&ed.__deleted?null:{grp:g.grp,...(ed||it)};
  })).flat().filter(Boolean);
  tmp.forEach(x=>gearFlat.push(x));
  USER.gear.forEach(u=>gearFlat.push({grp:"추가 장비",...u}));

  let out="\uFEFF[원두 정보]\n";
  out+=csvRows([["원두명","로스터리","원산지/농장","가공방식","품종","로스팅레벨","구매일","개봉일","구매처","특징/컵노트"],
    ...B.map(b=>[b.name,b.roaster,b.origin,b.process,b.variety,b.roast,b.buy,b.open,b.shop,b.note])]);
  out+="\n\n[커핑 시트]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨",...CUP_ITEMS.map(c=>c[1]),"균일성","클린컵","스위트니스","결점(감점)","총점","테이스팅 노트"],
    ...C.map(c=>[c.date,c.bean,c.roaster,c.roast,...CUP_ITEMS.map(([k])=>c[k]),c.uni,c.clean,c.sweetn,c.defect,total(c).toFixed(2),c.notes])]);
  out+="\n\n[에스프레소 기록]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨","그라인더 세팅","도징량(g)","추출량(g)","비율","프리인퓨전(초)","프리인퓨전압력(bar)","본압(bar)","바스켓","추출시간(초)","물온도(°C)","채널링여부","신맛","단맛","바디감","별점(1-5)","메모/이슈"],
    ...E.map(r=>[r.date,r.bean,r.roaster,r.roast,r.grind,r.dose,r.yield,(num(r.yield)/num(r.dose)).toFixed(2),r.pi,r.piBar,r.bar,r.basket,r.time,r.temp,r.channel?"Y":"N",r.acid,r.sweet,r.body,r.rating,r.memo])]);
  out+="\n\n[필터 기록]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨","드리퍼","그라인더 세팅","도징량(g)","물량(g)","비율","물온도(°C)","뜸시간(초)","푸어링시간","총추출시간","신맛","단맛","바디감","별점(1-5)","메모/이슈"],
    ...F.map(r=>[r.date,r.bean,r.roaster,r.roast,r.dripper,r.grind,r.dose,r.water,(num(r.water)/num(r.dose)).toFixed(1),r.temp,r.bloom,mmss(r.pour),mmss(r.total),r.acid,r.sweet,r.body,r.rating,r.memo])]);
  out+="\n\n[장비 정보]\n";
  out+=csvRows([["구분","장비명","비고"],...gearFlat.map(g=>[g.grp+" · "+g.k,g.n,g.m])]);

  const fname="커피_추출_기록_"+new Date().toISOString().slice(0,10)+".csv";
  let downloaded=false;
  try{
    const blob=new Blob([out],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=fname;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
    downloaded=true;
  }catch(e){downloaded=false}
  /* 브라우저/샌드박스가 다운로드를 막아도 데이터는 가져갈 수 있게 복사 패널을 항상 연다 */
  openCsvBox(out,fname,downloaded);
}

/* ============ 기기 간 동기화 (코드 방식) ============ */
function emptyUser(){return {espresso:[],filter:[],cupping:[],beans:[],recipes:[],gear:[],gearKinds:[],kindMeta:{},gearOrder:{},
  edits:{espresso:{},filter:{},cupping:{},beans:{},recipes:{}}, gearEdits:{}, gearV:2}}
function normalizeUser(p){
  const u=emptyUser();
  if(p._v)u._v=p._v;
  for(const k of ["espresso","filter","cupping","beans","recipes","gear","gearKinds"]) if(Array.isArray(p[k])) u[k]=p[k];
  if(p.edits) for(const k in u.edits) if(p.edits[k]) u.edits[k]=p.edits[k];
  if(p.kindMeta) u.kindMeta=p.kindMeta;
  if(p.gearOrder) u.gearOrder=p.gearOrder;
  if(p.gearEdits) u.gearEdits=p.gearV?p.gearEdits:migrateGearEdits(p.gearEdits);
  return u;
}
function syncCode(){
  return "BA1:"+btoa(unescape(encodeURIComponent(JSON.stringify({...USER,_v:APP_VERSION}))));
}
function openSync(){
  document.getElementById("syncout").value=syncCode();
  document.getElementById("syncin").value="";
  document.getElementById("syncerr").textContent="";
  document.getElementById("syncbox").classList.add("on");
  document.body.style.overflow="hidden";
}
function closeSync(){document.getElementById("syncbox").classList.remove("on");document.body.style.overflow=""}
function copySync(){
  const ta=document.getElementById("syncout");
  ta.focus();ta.select();
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast("코드를 복사했다 — 카톡 '나에게 보내기'로 옮기면 편하다"));return}
  toast(ok?"코드를 복사했다 — 카톡 '나에게 보내기'로 옮기면 편하다":"복사 실패 · 코드를 직접 선택해 복사해줘");
}
/* 비교용 직렬화 — 키 순서가 달라도 같은 기록으로 본다.
   JSON.stringify를 그대로 쓰면 같은 기록이 중복으로 합쳐진다. */
function canonKey(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(canonKey).join(",")+"]";
  return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canonKey(v[k])).join(",")+"}";
}
async function importSync(mode){
  const err=document.getElementById("syncerr");err.textContent="";
  const t=document.getElementById("syncin").value.trim();
  if(!t){err.textContent="다른 기기에서 복사한 코드를 붙여넣어줘";return}
  if(!t.startsWith("BA1:")){err.textContent="코드 형식이 아니야 (BA1: 으로 시작해야 함)";return}
  let p;
  try{p=normalizeUser(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))))}
  catch(e){err.textContent="코드를 읽을 수 없어 — 전체가 빠짐없이 복사됐는지 확인해줘";return}
  if(mode==="replace"){
    if(!await askConfirm("이 기기의 기록을 붙여넣은 코드의 기록으로 완전히 교체한다. 계속할까?","교체"))return;
    USER=p;
  }else{
    for(const k of ["espresso","filter","cupping","beans","recipes","gear","gearKinds"]){
      const seen=new Set(USER[k].map(canonKey));
      (p[k]||[]).forEach(r=>{
        const s=canonKey(r);
        if(!seen.has(s)){seen.add(s);USER[k].push(r)}
      });
    }
    for(const k in USER.edits) for(const i in p.edits[k]) if(!USER.edits[k][i]) USER.edits[k][i]=p.edits[k][i];
    for(const i in p.gearEdits) if(!USER.gearEdits[i]) USER.gearEdits[i]=p.gearEdits[i];
    for(const i in p.kindMeta) if(!USER.kindMeta[i]) USER.kindMeta[i]=p.kindMeta[i];
    for(const i in p.gearOrder) if(!USER.gearOrder[i]) USER.gearOrder[i]=p.gearOrder[i];
  }
  const ok=await persist();
  closeSync();renderEverything();
  let msg=ok?(mode==="replace"?"기록을 교체했다":"기록을 합쳤다"):"화면에는 반영했지만 저장에 실패했다";
  if(p._v&&typeof APP_VERSION!=="undefined"&&p._v!==APP_VERSION)
    msg+=" · ⚠ 코드를 만든 기기("+p._v+")와 이 기기("+APP_VERSION+")의 버전이 달라 — 두 기기 모두 최신 파일인지 확인해줘";
  else if(!p._v&&typeof APP_VERSION!=="undefined")
    msg+=" · ⚠ 구버전 기기에서 만든 코드라 일부 항목이 빠졌을 수 있어";
  toast(msg);
}

/* ============ 배경음악 ============ */
const BGM_SRC="bgm.mp3";
let bgm=null, bgmOn=false, bgmArmed=false, bgmIdx=0;
const bgmDead={};
const BGM_LIST=[
  {t:"First Bloom", s:BGM_SRC},
  {t:"Night Dose", s:"night-dose.mp3"},
  {t:"Fading into the Room", s:"fading-into-the-room.mp3"}
];
function bgmAlive(){return BGM_LIST.filter((_,i)=>!bgmDead[i]).length}
function bgmNextIdx(from){
  for(let k=1;k<=BGM_LIST.length;k++){
    const i=(from+k)%BGM_LIST.length;
    if(!bgmDead[i]) return i;
  }
  return -1;
}
function bgmLoad(i,autoplay){
  bgmIdx=i;
  if(bgm){try{bgm.pause()}catch(e){}}
  bgm=new Audio(BGM_LIST[i].s);
  bgm.loop=false;
  bgm.volume=0.35;
  bgm.addEventListener("ended",()=>{
    const n=bgmNextIdx(bgmIdx);
    if(n<0){bgmOn=false;updateBgmBtn();return}
    bgmLoad(n,true);
  });
  bgm.addEventListener("error",()=>{
    bgmDead[i]=true;
    if(!bgmAlive()){
      const b=document.getElementById("bgmbtn");if(b)b.style.display="none";
      const x=document.getElementById("bgmnext");if(x)x.style.display="none";
      bgmOn=false;return;
    }
    if(bgmOn){const n=bgmNextIdx(i); if(n>=0) bgmLoad(n,true)}
    updateBgmBtn();
  });
  updateBgmBtn();
  if(autoplay) bgm.play().catch(()=>{});
}
function bgmNext(){
  const n=bgmNextIdx(bgmIdx);
  if(n<0) return;
  bgmLoad(n,bgmOn);
  toast(`다음 곡 · ${BGM_LIST[n].t}`);
}
function updateBgmBtn(){
  const b=document.getElementById("bgmbtn");
  if(b) b.textContent=bgmOn?("🎵 "+BGM_LIST[bgmIdx].t):"🎵 음악";
  const n=document.getElementById("bgmnext");
  if(n) n.style.display=(bgmAlive()>1)?"":"none";
}
function bgmInit(){
  let last=0;
  try{last=Number(localStorage.getItem("coffeelab:bgmIdx"))||0}catch(e){}
  if(!(last>=0&&last<BGM_LIST.length)) last=0;
  bgmLoad(last,false);
  let pref=null;
  try{pref=localStorage.getItem("coffeelab:bgm")}catch(e){}
  if(pref==="on"){
    bgmOn=true; updateBgmBtn();
    bgm.play().catch(()=>{
      bgmArmed=true;
      const kick=()=>{if(bgmArmed&&bgmOn){bgm.play().catch(()=>{});bgmArmed=false}
        document.removeEventListener("pointerdown",kick)};
      document.addEventListener("pointerdown",kick);
    });
  }
}
function toggleBgm(){
  if(!bgm) bgmInit();
  bgmOn=!bgmOn;
  if(bgmOn) bgm.play().catch(()=>{});
  else bgm.pause();
  try{localStorage.setItem("coffeelab:bgm",bgmOn?"on":"off");
      localStorage.setItem("coffeelab:bgmIdx",String(bgmIdx))}catch(e){}
  updateBgmBtn();
  toast(bgmOn?`배경음악 · ${BGM_LIST[bgmIdx].t}`:"배경음악을 껐다");
}
bgmInit();

const REC_CATS=["에스프레소","필터","커핑","시그니처"];
const CH_LABEL=["없음","경미","심함"];
const chLv=r=>{if(!r)return 0;const c=r.channel;if(c===true)return 1;if(c===false||c==null||c==="")return 0;const n=Number(c);return isFinite(n)?Math.max(0,Math.min(2,n)):0};

/* ---- 분쇄도 대응표 (다이얼 ↔ μm) ---- */
function umPairs(){
  const map={};
  ["espresso","filter"].forEach(t=>all(t).forEach(r=>{
    const d=parseFloat(r.grind), u=Number(r.grindUm);
    if(!isFinite(d)||!isFinite(u)||u<=0) return;
    const k=d.toFixed(2);
    (map[k]=map[k]||[]).push(u);
  }));
  return Object.keys(map).map(k=>({d:Number(k),
    u:Math.round(map[k].reduce((a,b)=>a+b,0)/map[k].length),n:map[k].length}))
    .sort((a,b)=>a.d-b.d);
}
function interp(list,key,out,v){
  if(!isFinite(v)||!list.length) return null;
  if(list.length===1) return null;
  let lo=null,hi=null;
  for(const p of list){
    if(p[key]<=v&&(!lo||p[key]>lo[key])) lo=p;
    if(p[key]>=v&&(!hi||p[key]<hi[key])) hi=p;
  }
  if(lo&&hi&&lo!==hi){
    const t=(v-lo[key])/(hi[key]-lo[key]);
    return lo[out]+t*(hi[out]-lo[out]);
  }
  /* 범위 밖이면 양 끝 두 점의 기울기로 외삽 */
  const a=list[0], b=list[list.length-1];
  if(b[key]===a[key]) return null;
  const slope=(b[out]-a[out])/(b[key]-a[key]);
  return a[out]+(v-a[key])*slope;
}
function estUm(dial){
  const v=parseFloat(dial); const P=umPairs();
  const r=interp(P,"d","u",v);
  return r==null?null:Math.round(r/5)*5;
}
function estDial(um){
  const v=Number(um); const P=umPairs();
  const r=interp(P,"u","d",v);
  return r==null?null:(Math.round(r*20)/20).toFixed(2);
}
/* 폼에서 다이얼↔μm 상호 추정 안내 */
function umSync(from){
  const box=document.getElementById("umhint");
  if(!box) return;
  const P=umPairs();
  const d=V("f_grind"), u=V("f_grindum");
  if(P.length<2){
    box.style.display="";
    box.innerHTML=`<b>분쇄도 대응표</b> 아직 데이터가 부족해 — 다이얼과 μm을 함께 적은 기록이 2건 이상 쌓이면 자동 환산이 켜진다 (현재 ${P.length}건) ${guideBtn("측정하러 가기 ↗")}`;
    return;
  }
  let msg="";
  if(from==="d"&&d!==""){
    const e=estUm(d);
    if(e!=null) msg=`다이얼 <b>${esc(d)}</b> → 예상 <b>${e} μm</b>`;
  }else if(from==="u"&&u!==""){
    const e=estDial(u);
    if(e!=null) msg=`<b>${esc(u)} μm</b> → 예상 다이얼 <b>${e}</b>`;
  }
  if(!msg){box.style.display="none";box.innerHTML="";return}
  box.style.display="";
  box.innerHTML=`${msg} ${guideBtn("측정 ↗")}<span class="src">기준점 ${P.length}개 · ${P.map(p=>p.d+"→"+p.u).join(" · ")}</span>`;
}

/* ---- 푸어 스케줄 편집 ---- */
let pourRows=[];
function pourRender(){
  const w=document.getElementById("pourwrap");
  if(!w) return;
  if(!pourRows.length){
    w.innerHTML=`<div class="pour-empty">푸어 단계가 없다 — '＋ 단계 추가'로 최대 10단계까지</div>`;
    return;
  }
  let cum=0;
  w.innerHTML=`<div class="pour-hd"><span>#</span><span>시각</span><span>물량(g)</span><span>누적</span><span>교반</span><span></span></div>`+
  pourRows.map((p,i)=>{
    cum+=Number(p.g)||0;
    return `<div class="pour-r">
      <span class="pn">${i+1}</span>
      <input value="${esc(p.t||"")}" oninput="pourSet(${i},'t',this.value)">
      <input type="number" step="1" value="${p.g??""}" oninput="pourSet(${i},'g',this.value)">
      <span class="pc">${cum}g</span>
      <button type="button" class="pstir ${p.stir?"on":""}" onclick="pourSet(${i},'stir',!${!!p.stir})">${p.stir?"O":"—"}</button>
      <button type="button" class="pdel" onclick="pourDel(${i})">✕</button>
    </div>`}).join("")+
  `<div class="pour-sum">총 ${cum}g · ${pourRows.length}단계${pourRows.length>=10?" (최대)":""}</div>`;
}
function pourSet(i,k,v){
  if(!pourRows[i])return;
  pourRows[i][k]=(k==="g")?(v===""?"":Number(v)):v;
  if(k!=="t") pourRender(); else {
    let cum=0;const els=document.querySelectorAll("#pourwrap .pour-r .pc");
    pourRows.forEach((p,j)=>{cum+=Number(p.g)||0;if(els[j])els[j].textContent=cum+"g"});
  }
}
function pourAdd(){
  if(pourRows.length>=10){toast("푸어 단계는 최대 10단계까지야");return}
  const last=pourRows[pourRows.length-1];
  pourRows.push({t:last?"":"0:00",g:"",stir:false});
  pourRender();
}
function pourDel(i){pourRows.splice(i,1);pourRender()}
function pourCollect(){
  return pourRows.filter(p=>p.t||p.g!=="").map(p=>({t:String(p.t||"").trim(),g:Number(p.g)||0,stir:!!p.stir}));
}

  return "1:"+(y/d).toFixed(r.cat==="에스프레소"?2:1);

  const sorted=[...R].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
  const byCat={};
  sorted.forEach(r=>{(byCat[r.cat||"시그니처"]=byCat[r.cat||"시그니처"]||[]).push(r)});
  return `<div class="quickadd"><button class="addbtn solid" onclick="openModal('recipes')">＋ 레시피 추가</button></div>`
   +umTableHtml()

     <div class="recs">${byCat[c].map(recCard).join("")}</div></div>`).join("");
}

function recFind(scope,idx){
  return recAll().find(r=>(scope==="user"?r.__user===idx:String(r.__seed)===String(idx)));
}

/* ---- 레시피 → 기록 ---- */
function recToRecord(scope,idx){
  const r=recFind(scope,idx);
  if(!r){toast("레시피를 찾지 못했어");return}
  const t=(r.cat==="필터")?"filter":(r.cat==="커핑")?"cupping":"espresso";
  openModal(t);
  setTimeout(()=>{
    setV("f_grind",r.dial);setV("f_temp",r.temp);setV("f_dose",r.dose);setV("f_grindum",r.um);
    if(t==="espresso"){
      setPick("f_basket",r.basket);setV("f_yield",r.yield);
      setV("f_pi",r.pi);setV("f_pibar",r.piBar);setV("f_bar",r.bar);
      setV("f_time",r.total?String(sec(r.total)):"");
    }else if(t==="filter"){
      setPick("f_dripper",r.dripper);setV("f_water",r.yield);
      setV("f_bloom",r.bloom);setV("f_total",r.total);
      const ps=Array.isArray(r.pours)?r.pours:[];
      if(ps.length) setV("f_pour",ps[ps.length-1].t||"");
    }
    toast(`'${r.name}' 값을 불러왔다`);
  },0);
}
/* ---- 기록 → 레시피 ---- */
async function recFromRecord(type,scope,idx){
  const list=all(type);
  const r=list.find(x=>(scope==="user"?x.__user===idx:String(x.__seed)===String(idx)));
  if(!r){toast("기록을 찾지 못했어");return}
  const base={name:`${r.bean} ${type==="filter"?"드립":"샷"} (${r.date})`,
    cat:type==="filter"?"필터":"에스프레소",beanType:r.roast||"전체",
    dose:r.dose,dial:r.grind,temp:r.temp,memo:r.memo||"",fav:false,hist:[]};
  const rec=type==="filter"
    ?{...base,yield:r.water,dripper:r.dripper,bloom:r.bloom,total:mmss(r.total),
      pours:[{t:"0:00",g:Math.round(num(r.water)*0.2),stir:true},{t:mmss(r.pour),g:Math.round(num(r.water)*0.8),stir:false}]}
    :{...base,yield:r.yield,basket:r.basket,pi:r.pi,piBar:r.piBar,bar:r.bar,total:mmss(r.time)};
  USER.recipes.push(rec);
  const ok=await persist();
  renderEverything();
  toast(ok?"레시피로 저장했다":"화면에는 반영했지만 저장에 실패했다");
}

/* ---- 확인 모달 (일부 브라우저·미리보기에서 native confirm이 막히는 문제 대응) ---- */
function askConfirm(msg,okLabel){
  return new Promise(resolve=>{
    let ov=document.getElementById("confirmov");
    if(!ov){
      try{
        ov=document.createElement("div");ov.id="confirmov";ov.className="ov";
        document.body.appendChild(ov);
      }catch(e){
        /* DOM 조작조차 안 되면 native confirm으로 폴백 */
        try{resolve(!!window.confirm(msg))}catch(e2){resolve(false)}
        return;
      }
    }
    ov.innerHTML=`<div class="ovbox narrow">
      <div class="ovh"><h3>확인</h3></div>
      <p class="cmsg">${esc(msg)}</p>
      <div class="ovact">
        <button id="cf_no">취소</button>
        <button id="cf_yes" class="solid danger">${esc(okLabel||"삭제")}</button>
      </div></div>`;
    ov.classList.add("on");
    const done=v=>{ov.classList.remove("on");ov.innerHTML="";resolve(v)};
    const y=document.getElementById("cf_yes"), n=document.getElementById("cf_no");
    if(y) y.onclick=()=>done(true);
    if(n) n.onclick=()=>done(false);
    ov.onclick=e=>{if(e&&e.target===ov)done(false)};
  });
}

/* ---- 레시피 복제 ---- */
async function recDuplicate(scope,idx){
  const r=recFind(scope,idx);
  if(!r){toast("레시피를 찾지 못했어");return}
  const copy={...r};
  delete copy.__seed;delete copy.__user;delete copy.__edited;
  copy.hist=[];copy.fav=false;
  copy.name=String(r.name||"레시피")+" (사본)";
  copy.pours=(Array.isArray(r.pours)?r.pours:[]).map(p=>({...p}));
  USER.recipes.push(copy);
  const ok=await persist();
  renderEverything();
  toast(ok?`'${copy.name}' 을 만들었다 — 값을 바꿔서 내 레시피로 쓰면 돼`:"화면에는 반영했지만 저장에 실패했다");
}

/* ---- 타이머 ---- */
let recT={id:null,t0:0,steps:[],wake:null};
function recTimer(scope,idx){
  const r=recFind(scope,idx);
  if(!r){toast("레시피를 찾지 못했어");return}
  const ps=(Array.isArray(r.pours)?r.pours:[]).map((p,i)=>({...p,s:sec(p.t),n:i+1}));
  const totalS=sec(r.total)||(ps.length?ps[ps.length-1].s+30:0);
  recT.steps=ps;recT.total=totalS;
  let ov=document.getElementById("timerov");
  if(!ov){ov=document.createElement("div");ov.id="timerov";ov.className="ov";document.body.appendChild(ov)}
  ov.innerHTML=`<div class="ovbox">
    <div class="ovh"><h3>${esc(r.name)}</h3><button class="x" onclick="recTimerStop()">✕</button></div>
    <div class="tclock" id="tclock">0:00</div>
    <div class="tnext" id="tnext">시작을 누르면 카운트가 올라간다</div>
    <div class="tsteps" id="tsteps">${ps.length?ps.map(p=>
      `<div class="ts" id="ts${p.n}"><b>${p.n}</b><span>${esc(p.t)}</span><span>${p.g}g${p.stir?" ↻":""}</span></div>`).join("")
      :`<div class="ts none">푸어 단계가 없는 레시피 — 단순 타이머로 동작</div>`}</div>
    <div class="ovact">
      <button class="solid" id="tgo" onclick="recTimerGo()">▶ 시작</button>
      <button onclick="recTimerReset()">초기화</button>
      <button onclick="recTimerToRecord('${scope}',${typeof idx==="string"?`'${idx}'`:idx})">이 추출 기록하기</button>
    </div></div>`;
  ov.classList.add("on");
  recTimerReset();
}
function recTimerGo(){
  if(recT.id){clearInterval(recT.id);recT.id=null;const b=document.getElementById("tgo");if(b)b.textContent="▶ 계속";return}
  recT.t0=Date.now()-(recT.el||0)*1000;
  const b=document.getElementById("tgo");if(b)b.textContent="⏸ 일시정지";
  try{if(navigator.wakeLock&&!recT.wake)navigator.wakeLock.request("screen").then(w=>recT.wake=w).catch(()=>{})}catch(e){}
  recT.id=setInterval(recTick,200);
}
function recTick(){
  recT.el=Math.floor((Date.now()-recT.t0)/1000);
  const c=document.getElementById("tclock");if(c)c.textContent=mmss(recT.el);
  let next=null;
  recT.steps.forEach(p=>{
    const el=document.getElementById("ts"+p.n);
    if(!el) return;
    if(recT.el>=p.s){if(!el.classList.contains("done")){el.classList.add("done");recBeep()}}
    else if(next==null){next=p;el.classList.add("now")}
    if(recT.el<p.s&&next!==p) el.classList.remove("now");
  });
  const n=document.getElementById("tnext");
  if(n) n.textContent=next?`다음 ${next.n}단계 · ${next.g}g 까지 ${mmss(Math.max(0,next.s-recT.el))}`
    :(recT.total&&recT.el<recT.total?`총 ${mmss(recT.total)}까지 ${mmss(recT.total-recT.el)}`:"모든 단계 완료");
}
function recBeep(){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    const c=new A();const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;
    o.start();setTimeout(()=>{o.stop();c.close()},160);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}
}
function recTimerReset(){
  if(recT.id){clearInterval(recT.id);recT.id=null}
  recT.el=0;
  const c=document.getElementById("tclock");if(c)c.textContent="0:00";
  const b=document.getElementById("tgo");if(b)b.textContent="▶ 시작";
  document.querySelectorAll("#tsteps .ts").forEach(e=>{e.classList.remove("done");e.classList.remove("now")});
  const n=document.getElementById("tnext");if(n)n.textContent="시작을 누르면 카운트가 올라간다";
}
function recTimerStop(){
  if(recT.id){clearInterval(recT.id);recT.id=null}
  try{if(recT.wake){recT.wake.release();recT.wake=null}}catch(e){}
  const ov=document.getElementById("timerov");if(ov)ov.classList.remove("on");
}
function recTimerToRecord(scope,idx){
  const el=recT.el||0;
  recTimerStop();
  recToRecord(scope,idx);
  setTimeout(()=>{
    const r=recFind(scope,idx);
    if(r&&r.cat==="필터") setV("f_total",mmss(el));
    else setV("f_time",String(el));
    toast("타이머 시간까지 옮겼다");
  },30);
}

/* ---- 공유 카드 (PNG · 캔버스 직접 렌더) ---- */
function recCardCanvas(r){
  const W=1080,H=1080,S=2;
  const cv=document.createElement("canvas");
  cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  const F=(sz,w)=>`${w||400} ${sz}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif`;
  x.fillStyle="#FAF8F5";x.fillRect(0,0,W,H);
  x.fillStyle="#C9847A";x.fillRect(0,0,W,14);
  x.fillStyle="#8A8378";x.font=F(26,500);x.fillText("한 잔 록   ·   H A N J A N R O K",72,124);
  /* 제목 (길면 2줄) */
  x.fillStyle="#3A4149";x.font=F(56,700);
  const title=String(r.name||"");
  let ty=200;
  const lines=[];let cur="";
  for(const ch of title){
    if(x.measureText(cur+ch).width>W-160){lines.push(cur);cur=ch}else cur+=ch;
    if(lines.length>=2)break;
  }
  lines.push(cur);
  lines.slice(0,2).forEach(l=>{x.fillText(l,72,ty);ty+=66});
  x.fillStyle="#8A8378";x.font=F(28);
  x.fillText(`${r.cat||""} · ${r.beanType||"전체"}`,72,ty+2);
  let y=ty+40;
  x.strokeStyle="#DED8CF";x.lineWidth=2;
  x.beginPath();x.moveTo(72,y);x.lineTo(W-72,y);x.stroke();
  /* 항목 그리드 */
  const rows=[["도징",(r.dose??"—")+"g"],[r.cat==="에스프레소"?"수율":"물량",(r.yield??"—")+"g"],
    ["비율",recRatio(r)],["다이얼",r.dial||"—"],["온도",(r.temp??"—")+"°C"],["총시간",r.total||"—"]];
  if(r.cat==="에스프레소") rows.push(["바스켓",r.basket||"—"],["본압",(r.bar??"—")+"bar"]);
  if(r.cat==="필터") rows.push(["드리퍼",r.dripper||"—"],["뜸",(r.bloom??"—")+"s"]);
  y+=62;
  rows.forEach((kv,i)=>{
    const cx=72+(i%2)*470, cy=y+Math.floor(i/2)*88;
    x.fillStyle="#8A8378";x.font=F(24);x.fillText(String(kv[0]),cx,cy);
    x.fillStyle="#3A4149";x.font=F(38,600);
    let v=String(kv[1]);
    while(x.measureText(v).width>430&&v.length>3) v=v.slice(0,-2)+"…";
    x.fillText(v,cx,cy+42);
  });
  y+=Math.ceil(rows.length/2)*88+18;
  /* 푸어 스케줄 */
  const ps=Array.isArray(r.pours)?r.pours:[];
  if(ps.length){
    x.fillStyle="#8A8378";x.font=F(24);x.fillText("푸어 스케줄",72,y);
    y+=44;
    let cum=0;
    const two=ps.length>6;
    ps.slice(0,10).forEach((p,i)=>{
      cum+=Number(p.g)||0;
      const cx=72+(two?(i%2)*470:0), cy=y+(two?Math.floor(i/2):i)*46;
      x.fillStyle="#C9847A";x.font=F(24,700);x.fillText(String(i+1),cx,cy);
      x.fillStyle="#3A4149";x.font=F(30);
      x.fillText(`${p.t||""}   ${p.g}g${p.stir?"  ↻":""}`,cx+34,cy);
      x.fillStyle="#A9A296";x.font=F(22);
      x.fillText(`${cum}g`,cx+330,cy);
    });
    y+=(two?Math.ceil(ps.length/2):ps.length)*46+16;
  }
  /* 메모 */
  if(r.memo&&y<H-190){
    x.fillStyle="#8A8378";x.font=F(24);
    const words=String(r.memo).split(" ");
    let ln="",cy=y+16;
    for(const w of words){
      if(x.measureText(ln+w).width>W-150){x.fillText(ln,72,cy);ln=w+" ";cy+=34;if(cy>H-120)break}
      else ln+=w+" ";
    }
    if(cy<=H-120) x.fillText(ln,72,cy);
  }
  x.fillStyle="#A9A296";x.font=F(22);x.fillText(todayStr(),72,H-56);
  return cv;
}
async function recShare(scope,idx){
  const r=recFind(scope,idx);
  if(!r){toast("레시피를 찾지 못했어");return}
  let cv;
  try{cv=recCardCanvas(r)}catch(e){toast("카드 생성에 실패했어 — "+e.message);return}
  const fname=`hanjanrok_${String(r.name).replace(/[^0-9A-Za-z가-힣]+/g,"-")}.png`;
  const blob=await new Promise(res=>{
    try{
      if(cv.toBlob) cv.toBlob(b=>res(b),"image/png");
      else res(null);
    }catch(e){res(null)}
  });
  /* 1순위: 모바일 공유 시트 */
  if(blob&&navigator.canShare){
    try{
      const file=new File([blob],fname,{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:r.name});
        return;
      }
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  /* 2순위: 파일 다운로드 */
  if(blob){
    try{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download=fname;a.rel="noopener";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast("공유 카드를 저장했다");
      return;
    }catch(e){}
  }
  /* 3순위: 화면에 띄우고 길게 눌러 저장 */
  try{
    const data=cv.toDataURL("image/png");
    let ov=document.getElementById("shareov");
    if(!ov){ov=document.createElement("div");ov.id="shareov";ov.className="ov";document.body.appendChild(ov)}
    ov.innerHTML=`<div class="ovbox">
      <div class="ovh"><h3>공유 카드</h3><button class="x" onclick="document.getElementById('shareov').classList.remove('on')">✕</button></div>
      <img src="${data}" alt="${esc(r.name)} 공유 카드" style="width:100%;border-radius:10px;display:block">
      <p style="font-size:12.5px;opacity:.7;margin:10px 0 0;line-height:1.6">이 브라우저는 자동 저장을 막고 있어 — 이미지를 <b>길게 눌러 저장</b>하면 돼.</p>
    </div>`;
    ov.classList.add("on");
  }catch(e){toast("카드를 만들지 못했어 — "+(e.message||"알 수 없는 오류"))}
}

/* ---- 버전 이력 ---- */
function recHistory(scope,idx){
  const r=recFind(scope,idx);
  if(!r){toast("레시피를 찾지 못했어");return}
  const h=Array.isArray(r.hist)?r.hist:[];
  let ov=document.getElementById("histov");
  if(!ov){ov=document.createElement("div");ov.id="histov";ov.className="ov";document.body.appendChild(ov)}
  ov.innerHTML=`<div class="ovbox">
    <div class="ovh"><h3>${esc(r.name)} · 버전 이력</h3><button class="x" onclick="document.getElementById('histov').classList.remove('on')">✕</button></div>
    ${h.length?`<div class="hist">${h.slice().reverse().map((e,i)=>{
      const n=h.length-i;
      return `<div class="hi"><div><b>v${n}</b><span>${esc(e.ts||"")}</span></div>
        <div class="hs">${esc(recDigest(e.snap))}</div>
        <button onclick="recRestore('${scope}',${typeof idx==="string"?`'${idx}'`:idx},${h.length-1-i})">이 버전으로 복원</button></div>`}).join("")}</div>`
    :`<div class="hist none">아직 저장된 이력이 없다 — 레시피를 수정하면 직전 버전이 자동으로 보관된다 (최근 10개)</div>`}
  </div>`;
  ov.classList.add("on");
}
function recDigest(s){
  if(!s) return "—";
  return [s.dose!=null?s.dose+"g":null,s.yield!=null?"→"+s.yield+"g":null,
    s.dial?"다이얼 "+s.dial:null,s.temp!=null?s.temp+"°C":null,
    Array.isArray(s.pours)&&s.pours.length?s.pours.length+"단계":null].filter(Boolean).join(" · ")||"—";
}
async function recRestore(scope,idx,hi){
  const r=recFind(scope,idx);
  if(!r||!r.hist||!r.hist[hi]){toast("복원할 버전을 찾지 못했어");return}
  if(!await askConfirm("이 버전으로 되돌린다. 현재 내용은 이력에 보관된다.","복원")) return;
  const snap=r.hist[hi].snap;
  const cur={...r};delete cur.hist;delete cur.__seed;delete cur.__user;delete cur.__edited;
  const hist=[...r.hist,{ts:todayStr(),snap:cur}].slice(-10);
  const merged={...snap,hist};
  if(r.__user!=null) USER.recipes[r.__user]=merged;
  else USER.edits.recipes[r.__seed]=merged;
  const ok=await persist();
  document.getElementById("histov").classList.remove("on");
  renderEverything();
  toast(ok?"이전 버전으로 복원했다":"화면에는 반영했지만 저장에 실패했다");
}

function applyVersion(){
  const b=document.getElementById("verbtn");
  if(b) b.textContent=APP_VERSION+" · "+APP_BUILD;
}
function openVer(){
  const box=document.getElementById("verbox");
  document.getElementById("verlist").innerHTML=CHANGELOG.map(([v,d,txt])=>
    `<div class="ver-i"><div class="ver-v">${v}<span>${d}</span></div><div class="ver-t">${txt}</div></div>`).join("");
  box.classList.add("on");
  document.body.style.overflow="hidden";
}
function closeVer(){document.getElementById("verbox").classList.remove("on");document.body.style.overflow=""}
