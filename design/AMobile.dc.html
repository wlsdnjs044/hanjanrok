<!doctype html>
<html>

<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; }
    a { color: #E8A33D; text-decoration: none; }

<div style="width: 390px; height: 844px; background: #101319; color: #E4E7EC; font-family: 'IBM Plex Sans KR', 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- 상단 -->
  <div style="padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1C222B;">
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em; color: #F3F5F8;">한잔록</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5C6675; letter-spacing: 0.04em;">2026.09.14 · 기록 5건</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A333E; border-radius: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="1.9" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A333E; border-radius: 3px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="1.9" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 0;">

    <!-- 최근 추출 -->
    <div style="background: #161B22; border: 1px solid #242C37; border-radius: 4px; padding: 16px 17px 14px; display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #6E7987; letter-spacing: 0.16em;">LAST SHOT · 08-01</span>
          <span style="font-size: 17px; font-weight: 600; color: #F3F5F8; letter-spacing: -0.015em;">므쵸베리</span>
          <span style="font-size: 11.5px; color: #8A94A3;">모모스 · 미디엄라이트</span>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E8A33D; padding-top: 14px; letter-spacing: 0.04em;">★5</span>
      </div>

      <svg viewBox="0 0 320 96" style="width: 100%; height: 96px; display: block;">
        <line x1="24" y1="6" x2="24" y2="80" stroke="#2A333E" stroke-width="1"/>
        <line x1="24" y1="80" x2="312" y2="80" stroke="#2A333E" stroke-width="1"/>
        <line x1="24" y1="26" x2="312" y2="26" stroke="#1C242D" stroke-width="1" stroke-dasharray="2 5"/>
        <line x1="24" y1="53" x2="312" y2="53" stroke="#1C242D" stroke-width="1" stroke-dasharray="2 5"/>

        <text x="18" y="57" text-anchor="end" fill="#5C6675" font-family="IBM Plex Mono, monospace" font-size="8">5</text>
        <rect x="24" y="6" width="47" height="74" fill="#E8A33D" opacity="0.06"/>

        <circle cx="296" cy="30" r="2.8" fill="#E8A33D"/>
        <text x="24" y="93" fill="#5C6675" font-family="IBM Plex Mono, monospace" font-size="8">0s</text>
        <text x="312" y="93" text-anchor="end" fill="#5C6675" font-family="IBM Plex Mono, monospace" font-size="8">37s</text>
      </svg>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #242C37; border: 1px solid #242C37; border-radius: 3px; overflow: hidden;">
        <div style="background: #10151B; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: #5C6675; letter-spacing: 0.12em;">DOSE</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: #EDF0F4; font-variant-numeric: tabular-nums;">20.0</span>
        </div>
        <div style="background: #10151B; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: #5C6675; letter-spacing: 0.12em;">RATIO</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: #EDF0F4; font-variant-numeric: tabular-nums;">1:2.0</span>
        </div>
        <div style="background: #10151B; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: #5C6675; letter-spacing: 0.12em;">TIME</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: #E8A33D; font-variant-numeric: tabular-nums;">37s</span>
        </div>
      </div>
    </div>

    <!-- 시트 -->
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-radius: 3px; background: #151A21; border-left: 2px solid #E8A33D;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6E7987; width: 18px;">01</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #EDF0F4;">원두 노트</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #E8A33D; font-variant-numeric: tabular-nums;">5</span>
        <span style="font-size: 11px; color: #5C6675; width: 14px;">종</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-left: 2px solid transparent;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4C5563; width: 18px;">02</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #97A1AF;">컵 랩</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #47505E; font-variant-numeric: tabular-nums;">0</span>
        <span style="font-size: 11px; color: #414A57; width: 14px;">건</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-left: 2px solid transparent;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4C5563; width: 18px;">03</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #C8D0DA;">샷 로그</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #C8D0DA; font-variant-numeric: tabular-nums;">3</span>
        <span style="font-size: 11px; color: #5C6675; width: 14px;">건</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-left: 2px solid transparent;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4C5563; width: 18px;">04</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #C8D0DA;">푸어 로그</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #C8D0DA; font-variant-numeric: tabular-nums;">2</span>
        <span style="font-size: 11px; color: #5C6675; width: 14px;">건</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-left: 2px solid transparent;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4C5563; width: 18px;">05</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #C8D0DA;">레시피 북</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #C8D0DA; font-variant-numeric: tabular-nums;">33</span>
        <span style="font-size: 11px; color: #5C6675; width: 14px;">개</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px; border-left: 2px solid transparent;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4C5563; width: 18px;">06</span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #C8D0DA;">툴 킷</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #C8D0DA; font-variant-numeric: tabular-nums;">26</span>
        <span style="font-size: 11px; color: #5C6675; width: 14px;">개</span>
      </div>
    </div>

  </div>

  <!-- 하단 액션 -->
  <div style="padding: 12px 20px 22px; border-top: 1px solid #1C222B; background: #0B0D12; display: flex; gap: 10px;">
    <div style="flex-grow: 1; height: 50px; display: flex; align-items: center; justify-content: center; gap: 9px; background: #E8A33D; border-radius: 3px; color: #14171C; font-size: 15px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14171C" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      기록 추가
    </div>
    <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A333E; border-radius: 3px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
